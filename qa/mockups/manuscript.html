<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Макет: экран «Рукопись»</title>
<link rel="stylesheet" href="../../book-renderer/fonts.css">
<style>
:root{--ink:#3a2a1c;--ink2:rgba(58,42,28,.6);--gold:#c08a45;--cream:#f6ead8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;user-select:none}
body{font-family:Georgia,serif;color:var(--cream);
  background:radial-gradient(ellipse 75% 70% at 50% 46%,#e9cfa6 0,#c39a6b 34%,#7a5536 66%,#2a1d13 100%)}
/* пылинки в воздухе */
.dust{position:fixed;inset:0;pointer-events:none;z-index:1}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,240,215,.55);filter:blur(.6px);animation:dust linear infinite}
@keyframes dust{from{transform:translate(0,0)}to{transform:translate(40px,-120px)}}
/* сцена */
.space{position:fixed;inset:0;perspective:1400px;perspective-origin:50% 42%;z-index:2}
.world{position:absolute;left:50%;top:46%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.75,.2,1)}
.sheet{position:absolute;left:0;top:0;width:250px;height:354px;margin:-177px 0 0 -125px;transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.2,.75,.2,1),opacity 1s ease,filter 1s ease;cursor:grab}
.sheet .float{position:absolute;inset:0;animation:float var(--fd,7s) ease-in-out infinite alternate;animation-delay:var(--fdl,0s)}
@keyframes float{from{transform:translateY(-7px) rotateZ(calc(var(--rz,0deg) - .8deg)) rotateX(2deg)}to{transform:translateY(7px) rotateZ(calc(var(--rz,0deg) + .8deg)) rotateX(-2deg)}}
.paper{position:absolute;inset:0;padding:22px 22px 18px;border-radius:2px;color:var(--ink);overflow:hidden;
  background:linear-gradient(160deg,#fffaf1 0,#f6ecdc 55%,#eddcc2 100%);
  box-shadow:0 30px 50px rgba(40,22,8,.32),0 6px 14px rgba(40,22,8,.22);transition:box-shadow .5s,transform .5s cubic-bezier(.2,.8,.3,1)}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(120,80,40,.06) 100%)}
.sheet:hover .paper{transform:translateZ(40px) scale(1.03);box-shadow:0 44px 70px rgba(40,22,8,.38),0 10px 20px rgba(40,22,8,.25)}
.paper .ch{font:600 8px Georgia,serif;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.paper .ep{margin:8px 0 10px;font:italic 500 19px/1.15 'CormorantCy',Georgia,serif;color:#2c1f14}
.paper p{margin:0 0 7px;font:9.5px/1.55 'PTSerifCy',Georgia,serif;color:#4b3828;text-align:justify;hyphens:auto}
.paper img{display:block;width:100%;height:118px;object-fit:cover;margin:4px 0 6px;filter:sepia(.25) contrast(.95)}
.paper .cap{font:italic 8.5px Georgia,serif;color:var(--ink2);margin-bottom:6px}
.paper .no{position:absolute;right:16px;bottom:12px;font:9px Georgia,serif;color:var(--ink2)}
.sheet.is-new .paper{background:rgba(255,248,235,.18);border:1.5px dashed rgba(255,244,226,.7);box-shadow:none;display:flex;align-items:center;justify-content:center;color:var(--cream);font:italic 22px Georgia,serif;text-shadow:0 1px 6px rgba(60,35,15,.4)}
.sheet.dragging{cursor:grabbing;transition:none}
.sheet.dragging .float{animation-play-state:paused}
.sheet.dragging .paper{box-shadow:0 60px 90px rgba(40,22,8,.42)}
/* названия глав в воздухе */
.label{position:absolute;left:0;top:0;white-space:nowrap;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.75,.2,1),opacity 1s ease,filter 1s ease;pointer-events:none;text-align:center}
.label b{display:block;font:italic 500 56px/1 'CormorantCy',Georgia,serif;color:#fff6e8;text-shadow:0 2px 18px rgba(60,35,15,.45)}
.label small{display:block;margin-top:8px;font:12px Georgia,serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,246,232,.8)}
/* справа — оглавление для быстрого полёта */
.toc{position:fixed;right:34px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:14px;align-items:flex-end}
.toc button{appearance:none;border:0;background:none;cursor:pointer;font:italic 16px Georgia,serif;color:rgba(255,246,232,.55);display:flex;align-items:center;gap:10px;transition:color .4s}
.toc button i{width:8px;height:8px;border-radius:50%;background:rgba(255,246,232,.4);transition:all .4s}
.toc button.on{color:#fff6e8}.toc button.on i{background:var(--gold);box-shadow:0 0 10px var(--gold);width:10px;height:10px}
.toc button.drop{color:#fff;text-shadow:0 0 12px var(--gold)}
.toc .add{margin-top:6px;color:#f1d3a4}
/* сверху — три экрана */
.modes{position:fixed;left:50%;top:26px;transform:translateX(-50%);z-index:6;display:flex;gap:6px;padding:6px;border-radius:20px;background:linear-gradient(180deg,#f5e7cf,#dcc29a);box-shadow:inset 0 1px 0 #fff8ea,0 6px 16px rgba(40,22,8,.3)}
.modes button{appearance:none;border:0;cursor:pointer;padding:8px 18px;border-radius:15px;background:none;font:italic 16px Georgia,serif;color:#5a3f2a}
.modes button.on{background:#fffaf0;box-shadow:inset 0 1px 3px rgba(90,60,30,.25);color:#2c1f14}
.hint{position:fixed;left:30px;bottom:26px;z-index:5;max-width:380px;font:italic 14px/1.5 Georgia,serif;color:rgba(255,246,232,.75)}
/* открытый лист */
.veil{position:fixed;inset:0;z-index:8;background:rgba(30,20,12,.35);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .6s}
.veil.on{opacity:1;pointer-events:auto}
.open-card{position:fixed;left:50%;top:50%;z-index:9;width:min(46vh,520px);aspect-ratio:250/354;transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;transition:transform .8s cubic-bezier(.2,.8,.25,1),opacity .5s}
.open-card.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.open-card .paper{padding:46px 44px}
.open-card .paper .ep{font-size:34px}.open-card .paper p{font-size:16px}.open-card .paper img{height:220px}.open-card .paper .ch{font-size:11px}
.open-card .go{position:absolute;left:50%;bottom:-54px;transform:translateX(-50%);white-space:nowrap;font:italic 17px Georgia,serif;color:#fff6e8}
</style>
</head>
<body>
<div class="dust" id="dust"></div>
<div class="modes"><button class="on">Рукопись</button><button>Писать</button><button>Книга</button></div>
<div class="space" id="space"><div class="world" id="world"></div></div>
<nav class="toc" id="toc"></nav>
<div class="hint">Колёсико — лететь вглубь, от главы к главе. Возьмите лист и перетащите: внутри главы — поменять порядок, на название главы справа — перенести в другую главу. Двойной щелчок — открыть лист.</div>
<div class="veil" id="veil"></div>
<div class="open-card" id="openCard"></div>
<script>
const P='../demo-book/photos/';
const T=['Весной мы переехали в город. Отец получил место на заводе, а мать долго не могла привыкнуть к шуму улиц и чужим голосам за стеной.',
 'По вечерам собирались у самовара. Бабушка рассказывала о станице, о реке и о том, как в голодный год делили последний хлеб поровну.',
 'В письмах того времени повторяются одни и те же слова: «живы, здоровы, ждём». За ними — целая жизнь, которую трудно вместить в строчку.',
 'Дом на Плеханова помнили все: скрипучая лестница, герань на окне, кот Барсик, который спал только на отцовской шинели.'];
const chapters=[
 {title:'Глава 1. Начало',sheets:[['Первые воспоминания',0,'village_lane'],['Дом у реки',1],['Первая школа',2,'girl_flowers'],['Бабушка Мария',3,'grandma_porch']]},
 {title:'Глава 2. Тифлис',sheets:[['Переезд',0,'city_tiflis'],['Работа на заводе',2],['Свадьба',1,'mother_daughter_hats'],['Первая квартира',3],['Рождение сына',0,'mother_child_bw']]},
 {title:'Глава 3. Война',sheets:[['Проводы',2,'nikolai_portrait'],['Письма с фронта',2],['Эвакуация',1,'city_tashkent']]},
 {title:'Глава 4. Наша семья',sheets:[['Дети',3,'boy_dog'],['Лето на озере',1,'lake_mother_child'],['Внуки',0,'sunset_children'],['Для тех, кто продолжит',3]]}];
const world=document.getElementById('world'),toc=document.getElementById('toc');
let focus=0,els=[];
const rnd=(i,k)=>{const x=Math.sin(i*12.9898+k*78.233)*43758.5453;return x-Math.floor(x);};
function paper(ch,s,n,big){const [ep,ti,ph]=s;return `<div class="paper"><div class="ch">${ch.title.split('.')[0]}</div><div class="ep">${ep}</div>${ph?`<img src="${P+ph}.jpg" alt=""><div class="cap">${ep}, фото из семейного архива</div>`:''}<p>${T[ti]}</p><p>${T[(ti+1)%4]}</p>${ph?'':`<p>${T[(ti+2)%4]}</p><p>${T[(ti+3)%4]}</p>`}<div class="no">${n}</div></div>`;}
function build(){
  world.innerHTML='';els=[];toc.innerHTML='';let n=1;
  chapters.forEach((ch,c)=>{
    const lab=document.createElement('div');lab.className='label';lab.dataset.c=c;lab.innerHTML=`<b>${ch.title.split('. ')[1]}</b><small>${ch.title.split('.')[0]} · ${ch.sheets.length} ${ch.sheets.length<5?'листа':'листов'}</small>`;world.appendChild(lab);els.push(lab);
    [...ch.sheets,null].forEach((s,i)=>{const el=document.createElement('div');el.className='sheet'+(s?'':' is-new');el.dataset.c=c;el.dataset.i=i;
      el.style.setProperty('--fd',(6+rnd(c,i)*4).toFixed(1)+'s');el.style.setProperty('--fdl',(-rnd(i,c)*6).toFixed(1)+'s');el.style.setProperty('--rz',((rnd(c*7,i)-.5)*7).toFixed(1)+'deg');
      el.innerHTML=`<div class="float">${s?paper(ch,s,n++):'<div class="paper">＋ Лист</div>'}</div>`;world.appendChild(el);els.push(el);
      if(s){el.addEventListener('dblclick',()=>openSheet(ch,s,el));el.addEventListener('pointerdown',e=>startDrag(e,el));}});
    const b=document.createElement('button');b.dataset.c=c;b.innerHTML=`${ch.title.split('. ')[1]}<i></i>`;b.onclick=()=>go(c);toc.appendChild(b);});
  const add=document.createElement('button');add.className='add';add.textContent='＋ Новая глава';toc.appendChild(add);
  layout();}
function layout(){
  els.forEach(el=>{const c=+el.dataset.c,d=c-focus;
    const z=-d*1100,blur=d<0?0:Math.min(8,d*3.2),op=d<-0.6?0:d>2.6?0:Math.max(.12,1-d*.32);
    if(el.classList.contains('label')){el.style.transform=`translate3d(-50%,${-330-Math.max(0,d)*330}px,${z}px)`;el.style.opacity=d<-.4?0:Math.max(0,1-d*.38);el.style.filter=`blur(${blur*.6}px)`;return;}
    const i=+el.dataset.i,cnt=chapters[c].sheets.length+1,span=Math.min(300,1100/cnt);
    const dd=Math.max(0,d),x=(i-(cnt-1)/2)*span*(1.05+dd*.35)+(rnd(c,i)-.5)*40,y=(rnd(i,c)-.5)*90+Math.abs(i-(cnt-1)/2)*18-dd*300,ry=(i-(cnt-1)/2)*-6;
    el.style.transform=`translate3d(${x}px,${y}px,${z+(rnd(c+3,i)-.5)*120}px) rotateY(${ry}deg)`;
    el.style.opacity=op;el.style.filter=blur?`blur(${blur}px)`:'none';el.style.pointerEvents=Math.abs(d)<.5?'auto':'none';el.style.zIndex=String(100-Math.round(d*10));});
  [...toc.querySelectorAll('button[data-c]')].forEach(b=>b.classList.toggle('on',+b.dataset.c===Math.round(focus)));}
function go(c){focus=Math.max(0,Math.min(chapters.length-1,c));layout();}
let lock=0;addEventListener('wheel',e=>{if(Date.now()<lock)return;lock=Date.now()+700;go(Math.round(focus)+(e.deltaY>0?1:-1));},{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown')go(focus+1);if(e.key==='ArrowUp'||e.key==='PageUp')go(focus-1);if(e.key==='Escape')closeSheet();});
// перетаскивание листа
let drag=null;
function startDrag(e,el){if(e.button!==0)return;drag={el,sx:e.clientX,sy:e.clientY,base:el.style.transform,moved:false};el.setPointerCapture(e.pointerId);}
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;drag.el.classList.add('dragging');
  drag.el.style.transform=drag.base.replace('translate3d(',`translate3d(calc(${dx}px + `).replace(/px,([-\d.]+)px,/,(m,y)=>`px), calc(${dy}px + ${y}px),`)+' translateZ(120px)';
  const over=document.elementsFromPoint(e.clientX,e.clientY).find(n=>n.closest&&n.closest('#toc button[data-c]'));toc.querySelectorAll('button').forEach(b=>b.classList.toggle('drop',!!over&&over.closest('button')===b));});
addEventListener('pointerup',e=>{if(!drag)return;const {el,moved}=drag;drag=null;el.classList.remove('dragging');toc.querySelectorAll('button').forEach(b=>b.classList.remove('drop'));if(!moved)return;
  const c=+el.dataset.c,i=+el.dataset.i,list=chapters[c].sheets,item=list[i];
  const target=document.elementsFromPoint(e.clientX,e.clientY).map(n=>n.closest&&n.closest('#toc button[data-c]')).find(Boolean);
  if(target&&+target.dataset.c!==c){list.splice(i,1);chapters[+target.dataset.c].sheets.push(item);build();return;}
  // место внутри главы — по горизонтали
  const sheets=els.filter(x=>x.classList.contains('sheet')&&!x.classList.contains('is-new')&&+x.dataset.c===c&&x!==el);
  let to=sheets.filter(x=>x.getBoundingClientRect().left+x.getBoundingClientRect().width/2<e.clientX).length;
  list.splice(i,1);list.splice(to,0,item);build();});
function openSheet(ch,s,el){const card=document.getElementById('openCard');card.innerHTML=paper(ch,s,'')+'<div class="go">В редакторе этот лист откроется для письма · щёлкните, чтобы вернуться</div>';
  document.getElementById('veil').classList.add('on');requestAnimationFrame(()=>card.classList.add('on'));}
function closeSheet(){document.getElementById('openCard').classList.remove('on');document.getElementById('veil').classList.remove('on');}
document.getElementById('veil').onclick=closeSheet;document.getElementById('openCard').onclick=closeSheet;
// пыль
const dust=document.getElementById('dust');for(let i=0;i<46;i++){const d=document.createElement('i');d.style.left=(Math.random()*100)+'%';d.style.top=(Math.random()*100)+'%';d.style.opacity=(.2+Math.random()*.6).toFixed(2);d.style.animationDuration=(14+Math.random()*20)+'s';d.style.animationDelay=(-Math.random()*20)+'s';const s=1+Math.random()*3;d.style.width=d.style.height=s+'px';dust.appendChild(d);}
build();
</script>
</body>
</html>
