<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../book-renderer/fonts.css"><link rel="stylesheet" href="../book-renderer/design-pack-01.css"><style>body{margin:0}.dpk-page{position:absolute!important;left:0!important;top:0!important;width:522px!important;height:739px!important}.probe{position:absolute;left:70px;top:20px;width:180px;height:650px}.probe>p{height:auto!important}.probe::after{content:"";position:absolute;inset:0;border:1px solid red;pointer-events:none}#out{position:absolute;left:540px;top:0;width:500px;white-space:pre-wrap}</style></head><body><article class="dpk-page dpk-dom-paginated left"><div class="probe"><p class="dpk-source-copy"></p></div></article><pre id="out"></pre><script src="../book-renderer/design-pack-01.js"></script><script>
(async()=>{await OcherkiBookRenderer.readyFonts();const p=document.querySelector('.probe p'),box=p.parentElement;
const samples=[];for(let n=20;n<=520;n++)samples.push(Array.from({length:n},(_,i)=>`${i%7?'Семейная память хранит подробности прошлого и связывает поколения.':'Да. Мы были рядом.'} `).join(''));
const inspect=text=>{const split=OcherkiBookRenderer.splitRenderedText(p,text),leading=parseFloat(getComputedStyle(p).lineHeight);p.textContent=split.head;const r=document.createRange();r.selectNodeContents(p);const rects=[...r.getClientRects()].filter(rect=>rect.height>0),boxRect=box.getBoundingClientRect(),last=rects.at(-1);return {head:split.head.length,tail:split.tail.length,gap:last?boxRect.bottom-last.bottom:box.clientHeight,leading,lastRect:last&&{top:last.top,bottom:last.bottom,right:last.right},box:{top:boxRect.top,bottom:boxRect.bottom,right:boxRect.right},text:split.head.slice(-120)}};
let found=null;for(const text of samples){const result=inspect(text);if(result.tail&&result.gap>result.leading*2){found=result;break}}window.__repro={found,samples:samples.length,whiteSpace:getComputedStyle(p).whiteSpace};document.getElementById('out').textContent=JSON.stringify(window.__repro,null,2)})();
</script></body></html>
