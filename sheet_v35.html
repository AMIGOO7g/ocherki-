</div></div><div class="status" id="saveState">Черновик сохранён</div><div class="cloud" title="Синхронизировано"><svg viewBox="0 0 24 24"><path d="M7.5 18.2h9.1a4.1 4.1 0 0 0 .8-8.1A6 6 0 0 0 6 8.1a4.2 4.2 0 0 0 1.5 10.1Z"/></svg></div></div>
