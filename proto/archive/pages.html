.list{max-height:44vh;overflow:auto;max-width:540px;padding-right:6px;-webkit-mask-image:linear-gradient(180deg,#000 85%,transparent);mask-image:linear-gradient(180deg,#000 85%,transparent);scrollbar-width:thin;scrollbar-color:#6b4a2c transparent}

<script>
const A='../../assets/',P='../../qa/demo-book/photos/';
const Q=new URLSearchParams(location.search),S=Q.get('s')||'photo';
const wf=(n,played,live,sm)=>{let h=[];for(let k=0;k<n;k++){const e=.35+.65*Math.pow(Math.sin(Math.PI*k/n),.6);const v=e*(.35+.65*Math.abs(Math.sin(k*.53)*Math.cos(k*.21)+.25*Math.sin(k*1.7)));h.push(Math.max(.08,Math.min(1,v)));}
  const ph=Math.round(n*played);return `<div class="wf${live?' live':''}${sm?' sm':''}">${h.map((v,k)=>`<i class="${k<ph?'p':''}${Math.abs(k-ph)<6&&!live?' near':''}" style="--h:${v.toFixed(2)};--dl:-${((k*53%17)/10).toFixed(2)}s;--d:${(.35+(k*37%9)/18).toFixed(2)}s"></i>`).join('')}${live?'':`<span class="head" style="left:${(played*100).toFixed(1)}%"></span>`}</div>`;};
const keys=a=>`<div class="keys">${a.map((t,i)=>{const x=Array.isArray(t)?t[0]:t;return `<button class="k${i?'':' main'}">${x}</button>`;}).join('')}</div>`;
const nav=n=>`<div class="nav"><b>‹ предыдущее</b><span>${n}</span><b>следующее ›</b></div>`;

const qsRight=(sel)=>`<div class="kk">вопрос недели · эта неделя</div><h2>Ответы семьи</h2><div class="sub">6 из 8 ответили · 2 новых</div><div class="rule"></div>
  <div class="chips"><span class="on">все</span><span>голос</span><span>текст</span><span>фото</span></div>

 text:['Архив · Тексты',`<div class="sheet settle"><h3>Детство</h3><div class="print"><p>Мама впервые увидела трамвай, когда ей было шесть лет. Они с бабушкой шли по Головинскому, и вдруг из-за угла выехал красный вагон, звенящий, как колокольчик.</p><p>Мама спряталась за бабушкину юбку, а потом весь вечер рассказывала соседям, что видела «дом на колёсах».</p><p>Летом мы жили у тёти Вари на Плехановском, в комнате с окном во двор, где росла старая груша…</p></div></div>`,
  `<div class="kk">рассказ</div><h2>Детство</h2><div class="sub">Нина Петровна · 5 апреля</div><div class="rule"></div>${dl([['слов','412'],['в книге','глава 1 · «Детство»'],['фото','2 снимка к рассказу']])}${keys(['Открыть в редакторе','В книгу'])}${nav('1 из 3')}`],
 qs:['Архив · Вопрос недели',deck(),qsRight(-1)],
 qs_voice:['Архив · Вопрос недели',answerLeft(ANS[0]),qsRight(0)],
 qs_text:['Архив · Вопрос недели',answerLeft(ANS[1]),qsRight(1)],
 edits:['Архив · Правки',`<div class="sheet proof settle" id="proof"><h3>Тифлис</h3><div class="print"><p>Отец уходил рано, а возвращался затемно. <span class="e" data-n="0"><del>В сорок четвёртом</del><span class="over">В 1944 году</span></span> они шли пешком до Кутаиси и пели всю дорогу<span class="e" data-n="1"><span class="mark">,</span></span> чтобы не уснуть.</p><p>По субботам пекли хачапури, и весь двор пах сыром и дымом. Дом был <span class="e hl" data-n="2"><del>на две семьи</del><span class="over">на два хозяина</span></span>, во дворе росла старая груша.</p><p>Мама пекла <span class="e" data-n="3"><del>в ноябре месяце</del><span class="over">в ноябре</span></span> медовик, и вся улица знала, что скоро праздник…</p></div></div>`,
  `<div class="kk">правки · мастерская · 30 октября</div><h2>Вычитка главы</h2><div class="sub">4 правки — примите или отклоните каждую</div><div class="rule"></div>
   <div class="list">${[['В сорок четвёртом','В 1944 году','даты — цифрами'],['всю дорогу чтобы','всю дорогу, чтобы','запятая'],['на две семьи','на два хозяина','так говорила бабушка'],['в ноябре месяце','в ноябре','лишнее слово']].map(([w,n,c],i)=>`<div class="row${i===2?' on':''}" data-n="${i}"><span class="tx"><span class="was">${w}</span> → <span class="now">${n}</span><small>${c}</small></span><span class="ok">✓</span><span class="no">✕</span></div>`).join('')}</div>${keys(['Принять все','Открыть главу'])}`],

 record:['Архив · Записать голос',reels(true),
  `<div class="kk">записать голос · отвечает Нина Петровна</div><h2 class="q">Каким был ваш первый дом?</h2><div class="rule"></div><div class="onair"><i></i>идёт запись <b>01:24</b></div><div class="recrow"><span class="recbtn stop"></span>${wf(90,0,true)}</div><p class="story" style="font-size:17px">Нажмите «стоп», когда закончите. Запись никуда не уйдёт, пока вы её не сохраните.</p>`],

 send:['Архив · Вопрос недели',`<div class="phone"><img src="${A}archive/phone2.webp" alt=""><div class="scr"><div class="glow"></div><div class="time">10:00</div><div class="note"><b></b><span>Вопрос недели<small>от Нины Петровны · сейчас</small></span></div><div class="body"><i>вопрос недели</i><h4>Какое блюдо в детстве было праздничным?</h4><small>ответьте, как удобно</small><div class="mic"></div><div class="alt"><span>написать</span><span>фото</span></div></div></div></div>`,
  `<div class="kk">новый вопрос недели</div><h2>Кому отправить</h2><div class="sub">так вопрос увидят родные · ответят по ссылке, без регистрации</div><div class="rule"></div>
   <div class="chips"><span>детство</span><span>дом</span><span class="on">праздники</span><span>любовь</span><span>война</span><span>работа</span></div>
   <div class="list" style="max-height:30vh">${[['grandma_porch','Нина Петровна','бабушка · телефон'],['mother_daughter','Мама','почта'],['mountains_father_son','Сергей','телефон'],['girl_flowers','Варя','телефон'],['nikolai_portrait','Николай','почта']].map(([f,n,s])=>`<div class="row"><b class="av" style="background-image:url('${P}${f}.jpg')"></b><span class="tx">${n}<small>${s}</small></span><span class="tick">✓</span></div>`).join('')}</div>${keys(['Отправить в понедельник','Другой вопрос','+ Пригласить'])}`],
 qs_new:['Архив · Вопрос недели',`<div class="handoff" style="position:relative;height:100%;width:100%;display:flex;justify-content:center"><div class="phone"><img src="${A}archive/phone2.webp" alt=""><div class="scr"><div class="glow"></div><div class="time">19:42</div><div class="note"><b></b><span>Новый ответ<small>Нина Петровна · голос</small></span></div><div class="msg"><div class="who">Нина Петровна</div>${wf(46,0,true,true)}</div><div class="saved">сохранено в архив</div></div></div><div class="after">${disc('grandma_porch',false)}</div></div>`,
  qsRight(0)],

const [c,l,r]=PAGES[S];document.getElementById('crumb').textContent='‹ '+c;
document.getElementById('root').innerHTML=`<div class="page"><div class="obj${/send|qs_new/.test(S)?' ph':''}">${l}</div><div class="info">${r}</div></div>`;
// play / pause: the record turns only while it plays
document.getElementById('pp')?.addEventListener('click',e=>{const d=document.querySelector('.bigdisc');d.classList.toggle('playing');e.currentTarget.classList.toggle('paused',!d.classList.contains('playing'));});
// the deck: «another question» — the top card slides clear of the pile, then goes under it; the next is on top
const cycle=()=>{const dk=document.getElementById('deck');if(!dk)return;const top=dk.querySelector('[data-d="0"]');top.classList.add('out');
  setTimeout(()=>{dk.querySelectorAll('.card').forEach(c=>{if(c!==top)c.dataset.d=+c.dataset.d-1;});top.dataset.d=3;requestAnimationFrame(()=>top.classList.remove('out'));},700);};
document.querySelectorAll('[data-a],.keys .k').forEach(b=>{if(/другой вопрос/i.test(b.textContent))b.addEventListener('click',cycle);});
// the proof: each margin note beside its line, a thin line to the place
const proof=document.getElementById('proof');
if(proof){
  document.querySelectorAll('.row[data-n]').forEach(r=>r.addEventListener('mouseenter',()=>{const n=r.dataset.n;document.querySelectorAll('.row,.e,.mn').forEach(x=>x.classList.toggle(x.classList.contains('row')?'on':'hl',x.dataset.n===n));}));}
</script></body></html>
