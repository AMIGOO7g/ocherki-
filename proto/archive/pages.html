<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Архив — страницы</title>
<style>
@font-face{font-family:"SignThatS";src:url("../../assets/fonts/SignThatS.otf") format("opentype");font-display:swap}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#140a04;color:#f3e3c8;font-family:"Iowan Old Style",Georgia,serif}
.knight{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.knight>div{position:absolute;inset:0}
.nb{background:linear-gradient(180deg,#211006 0%,#1b0e06 36%,#150a04 72%,#0e0703 100%)}
.na{background:url("https://static.tildacdn.com/tild3564-6631-4539-a265-316165616139/photo.png") center/cover no-repeat;filter:brightness(.40) contrast(2) saturate(.58) sepia(.24);opacity:.54}
.nm{inset:-14% -12% -16% -14%!important;background:radial-gradient(ellipse 66% 60% at 49% 45%,rgba(236,168,91,.66) 0%,rgba(207,130,55,.55) 18%,rgba(164,88,27,.42) 38%,rgba(111,51,15,.27) 58%,rgba(62,27,9,.12) 75%,transparent 91%);filter:blur(56px);opacity:.88}
.nw{inset:-12% -8% -10% -12%!important;background:radial-gradient(ellipse 48% 44% at 41% 36%,rgba(244,187,112,.72) 0%,rgba(225,151,71,.62) 16%,rgba(190,111,39,.48) 34%,rgba(139,68,19,.31) 52%,rgba(82,37,11,.14) 70%,transparent 88%);filter:blur(66px);opacity:.9}
.ni{background:url("https://static.tildacdn.com/tild3564-6631-4539-a265-316165616139/photo.png") center/cover no-repeat;filter:grayscale(.08) brightness(.92) contrast(1.4) saturate(.36) sepia(.12);mix-blend-mode:multiply;opacity:.09}
.nv{inset:-6%!important;background:radial-gradient(circle at 0% 0%,rgba(0,0,0,.7) 0%,transparent 40%),radial-gradient(circle at 100% 0%,rgba(0,0,0,.76) 0%,transparent 42%),radial-gradient(circle at 0% 100%,rgba(0,0,0,.78) 0%,transparent 43%),radial-gradient(circle at 100% 100%,rgba(0,0,0,.84) 0%,transparent 44%),radial-gradient(ellipse 94% 86% at 46% 43%,transparent 40%,rgba(0,0,0,.28) 84%,rgba(0,0,0,.54) 100%)}

.dim{position:fixed;inset:0;background:radial-gradient(ellipse 80% 70% at 45% 50%,rgba(0,0,0,.05),rgba(0,0,0,.45));pointer-events:none}
.top{position:fixed;left:28px;right:28px;top:22px;display:flex;justify-content:space-between;align-items:center;z-index:5;font:italic 17px Georgia,serif;color:#d9bf98}
.top .x{width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,197,142,.35);display:grid;place-items:center;font-style:normal}
.page{position:fixed;inset:84px 6vw 44px;display:grid;grid-template-columns:1.1fr 1fr;gap:5vw;align-items:center}
.obj{display:flex;align-items:center;justify-content:center;height:100%;min-height:0;position:relative}
.info{max-height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center}
/* ---------- the catalogue style ---------- */
.kk{font:500 12px "Iowan Old Style",Georgia,serif;letter-spacing:.42em;text-transform:uppercase;color:#d8b47e}
h2{margin:30px 0 6px;font:400 60px/1.05 "SignThatS",Georgia,serif;color:#fff2dc;text-shadow:0 0 22px rgba(255,160,70,.25)}
h2.q{font-size:46px;line-height:1.15}
.sub{font:italic 21px Georgia,serif;color:#e9cfa6}
.rule{width:120px;height:1px;margin:24px 0;flex:none;background:linear-gradient(90deg,#e8c58e,rgba(232,197,142,0))}
dl{display:grid;grid-template-columns:auto 1fr;gap:12px 28px;margin:0;font:18px/1.35 Georgia,serif}
dt{font:500 11px "Iowan Old Style",Georgia,serif;letter-spacing:.3em;text-transform:uppercase;color:#bf9a6c;padding-top:5px}dd{margin:0;color:#f6e8d2}
.story{margin:24px 0 0;max-width:480px;font:italic 20px/1.55 Georgia,serif;color:#ead6b4}
.keys{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.k{height:46px;padding:0 24px;border-radius:23px;border:1px solid rgba(232,197,142,.35);background:none;color:#f2e0c2;font:italic 17px Georgia,serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:box-shadow .5s,border-color .5s}
.k:hover{border-color:rgba(255,206,150,.95);box-shadow:0 0 14px 2px rgba(255,150,60,.35)}
.k.main{border-color:rgba(255,206,150,.95);color:#ffe9c9;box-shadow:0 0 12px 2px rgba(255,150,60,.45)}
.nav{display:flex;align-items:center;gap:16px;margin-top:16px;font:italic 15px Georgia,serif;color:#c99a6a}.nav b{font-weight:400;color:#e9d3b0}
/* ---------- the player: hairlines on a centre line, the played part gold ---------- */
.pl{display:flex;align-items:center;gap:20px;max-width:520px}
.pp{width:60px;height:60px;flex:none;border-radius:50%;border:1px solid #e8c58e;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 18px rgba(255,170,90,.35),inset 0 0 12px rgba(255,190,120,.12)}
.pp::after{content:"";border-left:3px solid #ffe9c9;border-right:3px solid #ffe9c9;width:5px;height:16px}
.pp.paused::after{border:0;width:0;height:0;border-left:15px solid #ffe9c9;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.pp.stop{border-color:#e46a4a;box-shadow:0 0 22px rgba(240,90,60,.45)}.pp.stop::after{border:0;width:16px;height:16px;border-radius:3px;background:#ffe9c9}
.pp.sm{width:44px;height:44px}.pp.sm::after{height:12px;width:4px}
.wf{position:relative;flex:1;height:56px;display:flex;align-items:center;gap:2px}
.wf.sm{height:36px}
.wf i{flex:1;max-width:2px;height:calc(var(--h)*100%);border-radius:2px;background:rgba(232,197,142,.28);transform-origin:center}
.wf i.p{background:linear-gradient(180deg,#fff0d4,#e8b26a 50%,#fff0d4)}
.wf i.near{animation:br 1.1s ease-in-out var(--dl) infinite alternate}
@keyframes br{to{transform:scaleY(1.25)}}
.wf .head{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff3dc;box-shadow:0 0 10px 3px rgba(255,190,110,.7)}
.wf.live i{animation:lv var(--d) ease-in-out var(--dl) infinite alternate;background:linear-gradient(180deg,#ffd8c8,#e46a4a 50%,#ffd8c8)}
@keyframes lv{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.tm{display:flex;justify-content:space-between;max-width:520px;padding-left:80px;margin-top:6px;font:italic 14px Georgia,serif;color:#c99a6a}
/* ---------- the photo: one frame for any proportion (its corners and scalloped edges never stretch) ---------- */
.fr{position:relative;border-style:solid;border-width:5.4vh 4.2vh;border-image:url("../../assets/archive/frame.webp") 79 63 79 63 stretch;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7));background:#e9dcc0;background-clip:padding-box}
.fr .pic{display:block;height:58vh;max-width:36vw;object-fit:cover}
.fr.land .pic{height:auto;width:34vw;max-height:52vh}
/* developing: the paper is white in the tray, the shadows come first, then the midtones; in amber safelight */
.fr .pic{animation:dev 1.9s cubic-bezier(.35,.1,.3,1) both}
@keyframes dev{0%{filter:brightness(2.3) contrast(.2) sepia(.3) blur(1.5px)}35%{filter:brightness(1.6) contrast(.5) sepia(.35) blur(.8px)}70%{filter:brightness(1.12) contrast(.9) sepia(.3) blur(0)}100%{filter:brightness(1) contrast(1.05) sepia(.25) blur(0)}}
.fr::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(200,80,30,.22);mix-blend-mode:multiply;animation:safe 1.9s ease both}
@keyframes safe{0%{opacity:1}100%{opacity:0}}
.fr::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,245,225,.32) 50%,transparent 65%);background-size:250% 100%;background-position:120% 0;animation:gloss 1.6s ease 1.9s both}
@keyframes gloss{to{background-position:-30% 0}}
/* ---------- the record ---------- */
.bigdisc{position:relative;width:min(62vh,40vw);aspect-ratio:1}
.bigdisc .spin{position:absolute;inset:0;animation:sp 3.6s linear infinite;animation-play-state:paused}
.bigdisc.playing .spin{animation-play-state:running}
.bigdisc .spin img{width:100%;height:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.bigdisc .lab{position:absolute;left:28.4%;top:28.4%;width:43.2%;height:43.2%;border-radius:50%;background:center/cover;filter:sepia(.45) brightness(.82)}
.bigdisc .sh{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.9}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- the tape recorder: the reels turn under the machine's own top layer ---------- */
.rec{position:relative;width:min(64vh,40vw);aspect-ratio:900/935}
.rec>img{position:absolute;inset:0;width:100%;height:100%}
.rec .base{filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.rec .reel{position:absolute;aspect-ratio:1}
.rec .reel img{width:100%;height:100%;animation:sp 2.6s linear infinite reverse}
.rec .reel.r2 img{animation-duration:3.4s}
.rec .lamp{position:absolute;left:24.5%;top:80.5%;width:1.4%;aspect-ratio:1;border-radius:50%;background:#ff5a3a;box-shadow:0 0 10px 4px rgba(255,80,50,.75);animation:bl 1.2s ease-in-out infinite alternate}
@keyframes bl{to{opacity:.3}}
.live{display:flex;align-items:center;gap:10px;margin:2px 0 14px;font:500 14px "Iowan Old Style",Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:#f0a58e}
.live i{width:10px;height:10px;border-radius:50%;background:#e2503a;box-shadow:0 0 8px #e2503a;animation:bl 1s ease-in-out infinite alternate}
.live b{font:400 22px Georgia,serif;letter-spacing:.06em;color:#fff2dc;text-transform:none}
/* ---------- laid paper: letters, stories, proofs ---------- */
.sheet{position:relative;width:min(540px,100%);height:76vh;padding:52px 58px;background:url("../../assets/keeper/desk-paper.jpg") center/cover;color:#2a1c12;box-shadow:0 2px 3px rgba(0,0,0,.3),0 34px 60px rgba(0,0,0,.6);rotate:-.8deg}
.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 110% at 0% 0%,rgba(255,240,215,.16),transparent 55%),linear-gradient(135deg,transparent 50%,rgba(60,35,15,.2))}
.sheet .hand{font:400 25px/1.5 "SignThatS",Georgia,serif;color:#33231a}
.sheet .print{font:18px/1.7 Georgia,serif}
.sheet h3{margin:0 0 16px;font:400 38px "SignThatS",Georgia,serif;color:#4b3424}
.settle{animation:settle 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes settle{from{opacity:0;transform:translateY(26px) rotate(-3deg)}to{opacity:1;transform:none}}
/* the letter: the opened envelope lies under it, whole; the letter comes up out of it */
.lw{position:relative;width:min(560px,100%);height:78vh}
.lw .env{position:absolute;left:-6%;bottom:2%;width:82%;rotate:-7deg;filter:drop-shadow(0 20px 26px rgba(0,0,0,.6));animation:envin .7s ease both}
.lw .sheet{position:absolute;right:0;top:0;width:86%;height:86%;padding:44px 48px;rotate:2deg;animation:outof 1.3s cubic-bezier(.2,.8,.3,1) .35s both}
@keyframes outof{from{transform:translate(-14%,30%) rotate(-9deg);opacity:.0}25%{opacity:1}to{transform:none;opacity:1}}
@keyframes envin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
/* the proof: the corrector's marks in red ink on the margin, a thin line to the place */
.sheet.proof{padding-right:170px}
.sheet .print .e{border-radius:2px;transition:background .4s}
.sheet .print .e.hl{background:rgba(232,170,80,.32)}
.sheet del{color:#a8302a;text-decoration-thickness:1.6px}
.sheet .mn{position:absolute;right:22px;width:138px;font:400 22px/1.1 "SignThatS",Georgia,serif;color:#a8302a;rotate:-3deg;transition:transform .4s}
.sheet .mn small{display:block;font:italic 12px Georgia,serif;color:#a8302a;opacity:.8;margin-top:2px}
.sheet .mn.hl{transform:scale(1.08)}
.sheet svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.sheet svg.ln path{fill:none;stroke:#a8302a;stroke-width:1.2;opacity:.7;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* rows on the right (answers, proofs, family) */
.list{max-height:44vh;overflow:auto;max-width:540px;padding-right:6px;-webkit-mask-image:linear-gradient(180deg,#000 85%,transparent);mask-image:linear-gradient(180deg,#000 85%,transparent);scrollbar-width:thin;scrollbar-color:#6b4a2c transparent}
.row{display:flex;align-items:center;gap:14px;padding:13px 10px;border-top:1px solid rgba(232,197,142,.16);border-radius:10px;cursor:pointer;transition:background .35s}
.row:hover,.row.on{background:rgba(255,200,140,.07)}
.row.on{box-shadow:inset 2px 0 0 #e8c58e}
.row .av{width:44px;height:44px;border-radius:50%;background:center/cover #3a2a1c;flex:none;box-shadow:0 0 0 1px rgba(232,197,142,.5)}
.row .tx{flex:1;font:17px/1.35 Georgia,serif;color:#f6e8d2}.row .tx small{display:block;font:italic 14px Georgia,serif;color:#bf9a6c}
.row .was{color:#d98a7a;text-decoration:line-through}.row .now{color:#ffe9c9}
.row .ok,.row .no{width:36px;height:36px;border-radius:50%;border:1px solid rgba(232,197,142,.4);display:grid;place-items:center;font:16px Georgia,serif;color:#f2e0c2;flex:none}
.row .ok{border-color:#e8c58e;color:#ffe9c9}
.row .ty{font:500 10px "Iowan Old Style",Georgia;letter-spacing:.24em;text-transform:uppercase;color:#d8b47e;border:1px solid rgba(232,197,142,.35);padding:4px 8px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chips span{padding:6px 14px;border-radius:16px;border:1px solid rgba(232,197,142,.3);font:italic 15px Georgia,serif;color:#e9d3b0;cursor:pointer}
.chips span.on{border-color:#ffd9a8;color:#fff;box-shadow:0 0 10px rgba(255,150,60,.35)}
.tick{width:22px;height:22px;border-radius:5px;border:1px solid rgba(232,197,142,.6);display:grid;place-items:center;color:#ffe9c9;font:14px Georgia}
/* ---------- the deck of question cards ---------- */
.deck{position:relative;width:min(500px,100%);aspect-ratio:1.45}
.card{position:absolute;inset:0;padding:40px 46px;border-radius:8px;background:url("../../assets/keeper/desk-paper.jpg") center/cover;color:#2a1c12;box-shadow:0 2px 3px rgba(0,0,0,.3),0 22px 40px rgba(0,0,0,.5);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .7s cubic-bezier(.45,.05,.3,1),filter .7s;will-change:transform}
.card i{font:600 12px Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#8a6a48;font-style:normal}
.card h3{margin:14px 0 14px;font:italic 32px/1.25 Georgia,serif}.card small{font:italic 14px Georgia,serif;color:#8a6a48}
.card[data-d="0"]{transform:rotate(-1deg);z-index:4}
.card[data-d="1"]{transform:translate(10px,10px) rotate(2.5deg);z-index:3;filter:brightness(.82)}
.card[data-d="2"]{transform:translate(-8px,18px) rotate(-3.5deg);z-index:2;filter:brightness(.7)}
.card[data-d="3"]{transform:translate(4px,26px) rotate(1.5deg);z-index:1;filter:brightness(.6)}
.card.out{transform:translate(78%,-8%) rotate(8deg)!important;z-index:5!important}
/* the answer shown on the left */
.note{width:min(460px,100%);padding:44px 48px;background:url("../../assets/keeper/desk-paper.jpg") center/cover;color:#2a1c12;box-shadow:0 2px 3px rgba(0,0,0,.3),0 30px 50px rgba(0,0,0,.55);rotate:1.5deg;font:400 26px/1.5 "SignThatS",Georgia,serif}
.note small{display:block;margin-top:18px;font:italic 15px Georgia,serif;color:#7a5a3a}
/* ---------- the phone: our own content on its screen ---------- */
.phone{position:relative;height:74vh;aspect-ratio:842/1410;filter:drop-shadow(0 30px 40px rgba(0,0,0,.65))}
.phone>img{width:100%;height:100%}
.phone .scr{position:absolute;left:14.6%;top:2.7%;width:74.1%;height:94.5%;rotate:9deg;border-radius:7%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12% 10%;text-align:center;background:radial-gradient(ellipse 90% 60% at 50% 40%,rgba(120,60,20,.5),transparent 70%)}
.phone .scr i{font:600 10px Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#d8b47e;font-style:normal}
.phone .scr h4{margin:0;font:italic 28px/1.25 Georgia,serif;color:#fff2dc}
.phone .scr small{font:italic 13px Georgia,serif;color:#c99a6a}
.phone .scr .mic{width:70px;height:70px;border-radius:50%;border:1px solid #e8c58e;display:grid;place-items:center;box-shadow:0 0 22px rgba(255,160,70,.45);margin-top:10px}
.phone .scr .mic::after{content:"";width:14px;height:24px;border-radius:7px;border:2px solid #ffe9c9}
.phone .scr .alt{display:flex;gap:8px}.phone .scr .alt span{padding:7px 12px;border-radius:14px;border:1px solid rgba(232,197,142,.4);font:italic 13px Georgia;color:#e9d3b0}
</style></head><body>
<div class="knight"><div class="nb"></div><div class="na"></div><div class="nm"></div><div class="nw"></div><div class="ni"></div><div class="nv"></div></div><div class="dim"></div>
<div class="top"><span id="crumb"></span><span class="x">✕</span></div>
<div id="root"></div>
<script>
const A='../../assets/',P='../../qa/demo-book/photos/';
const Q=new URLSearchParams(location.search),S=Q.get('s')||'photo';
const wf=(n,played,live,sm)=>{let h=[];for(let k=0;k<n;k++){const e=.35+.65*Math.pow(Math.sin(Math.PI*k/n),.6);const v=e*(.35+.65*Math.abs(Math.sin(k*.53)*Math.cos(k*.21)+.25*Math.sin(k*1.7)));h.push(Math.max(.08,Math.min(1,v)));}
  const ph=Math.round(n*played);return `<div class="wf${live?' live':''}${sm?' sm':''}">${h.map((v,k)=>`<i class="${k<ph?'p':''}${Math.abs(k-ph)<6&&!live?' near':''}" style="--h:${v.toFixed(2)};--dl:-${((k*53%17)/10).toFixed(2)}s;--d:${(.35+(k*37%9)/18).toFixed(2)}s"></i>`).join('')}${live?'':`<span class="head" style="left:${(played*100).toFixed(1)}%"></span>`}</div>`;};
const keys=a=>`<div class="keys">${a.map((t,i)=>{const x=Array.isArray(t)?t[0]:t;return `<button class="k${i?'':' main'}">${x}</button>`;}).join('')}</div>`;
const nav=n=>`<div class="nav"><b>‹ предыдущее</b><span>${n}</span><b>следующее ›</b></div>`;
const dl=r=>`<dl>${r.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const disc=(f,play)=>`<div class="bigdisc${play?' playing':''}"><div class="spin"><img src="${A}keeper/desk-vinyl-disc.webp" alt=""><i class="lab" style="background-image:url('${P}${f}.jpg')"></i></div><img class="sh" src="${A}keeper/desk-vinyl-shine.webp" alt=""></div>`;
const REELS=[[283,492,135,93,-6],[569,426,129,88,-8]];
const rec=()=>`<div class="rec"><img class="base" src="${A}archive/recorder.webp" alt="">${REELS.map(([cx,cy,a,b,t],i)=>`<div class="reel r${i+1}" style="left:${((cx-a)/900*100).toFixed(2)}%;top:${((cy-a)/935*100).toFixed(2)}%;width:${(2*a/900*100).toFixed(2)}%;transform:rotate(${t}deg) scaleY(${(b/a).toFixed(3)})"><img src="${A}archive/reel${i}.webp" alt=""></div>`).join('')}<img src="${A}archive/recorder-top.webp" alt=""><i class="lamp"></i></div>`;
const QS=['Как вы познакомились с дедушкой?','Какое блюдо в детстве было праздничным?','Каким был ваш первый дом?','Какую песню пели в семье?'];
const deck=(i0=0)=>`<div class="deck" id="deck">${[3,2,1,0].map(d=>`<div class="card" data-d="${d}"><i>вопрос недели</i><h3>${QS[(i0+d)%QS.length]}</h3><small>${d?'':'тема: любовь · отправлен 10 ноября'}</small></div>`).join('')}</div>`;
const ANS=[['voice','grandma_porch','Нина Петровна','голос · 2:28 · вчера'],['text','mother_daughter','Мама','текст · 3 дня назад'],['photo','girl_flowers','Варя','фото · 3 дня назад'],['voice','nikolai_portrait','Николай','голос · 1:12 · неделю назад'],['text','mountains_father_son','Сергей','текст · неделю назад'],['voice','mother_kiss','Анна','голос · 0:54 · неделю назад']];
const answerLeft=a=>a[0]==='voice'?disc(a[1],true):a[0]==='photo'?`<div class="fr land"><img class="pic" src="${P}city_tiflis.jpg" alt=""></div>`:`<div class="note settle">Он пришёл на танцы в чужом пиджаке, на два размера больше. Я смеялась весь вечер, а через год мы поженились.<small>Мама · ответ на вопрос недели</small></div>`;
const qsRight=(sel)=>`<div class="kk">вопрос недели</div><h2 class="q">Как вы познакомились с дедушкой?</h2><div class="sub">ответили 6 из 8</div><div class="rule"></div>
  <div class="chips"><span class="on">все</span><span>голос</span><span>текст</span><span>фото</span></div>

 edits:['Архив · Правки',`<div class="sheet proof settle" id="proof"><h3>Тифлис</h3><div class="print"><p>Отец уходил рано, а возвращался затемно. <span class="e" data-n="0"><del>В сорок четвёртом</del></span> они шли пешком до Кутаиси и пели всю дорогу<span class="e" data-n="1"> </span>чтобы не уснуть.</p><p>По субботам пекли хачапури, и весь двор пах сыром и дымом. Дом был <span class="e hl" data-n="2"><del>на две семьи</del></span>, во дворе росла старая груша.</p><p>Мама пекла <span class="e" data-n="3"><del>в ноябре месяце</del></span> медовик, и вся улица знала, что скоро праздник…</p></div>
   <div class="mn" data-n="0">В 1944 году<small>даты — цифрами</small></div><div class="mn" data-n="1">, <small>запятая</small></div><div class="mn hl" data-n="2">на два хозяина<small>слова бабушки</small></div><div class="mn" data-n="3">в ноябре<small>лишнее слово</small></div><svg class="ln"></svg></div>`,
  `<div class="kk">правки</div><h2>Вычитка главы</h2><div class="sub">Мастерская · 30 октября · 4 правки</div><div class="rule"></div>
   <div class="list">${[['В сорок четвёртом','В 1944 году','даты — цифрами'],['всю дорогу чтобы','всю дорогу, чтобы','запятая'],['на две семьи','на два хозяина','так говорила бабушка'],['в ноябре месяце','в ноябре','лишнее слово']].map(([w,n,c],i)=>`<div class="row${i===2?' on':''}" data-n="${i}"><span class="tx"><span class="was">${w}</span> → <span class="now">${n}</span><small>${c}</small></span><span class="ok">✓</span><span class="no">✕</span></div>`).join('')}</div>${keys(['Принять все','Открыть главу'])}`],

 send:['Архив · Вопрос недели',`<div class="phone"><img src="${A}archive/phone2.webp" alt=""><div class="scr"><i>вопрос недели · от Нины</i><h4>Какое блюдо в детстве было праздничным?</h4><small>ответьте, как удобно</small><span class="mic"></span><div class="alt"><span>написать</span><span>фото</span></div></div></div>`,

document.getElementById('root').innerHTML=`<div class="page"><div class="obj">${l}</div><div class="info">${r}</div></div>`;
// play / pause: the record turns only while it plays
document.getElementById('pp')?.addEventListener('click',e=>{const d=document.querySelector('.bigdisc');d.classList.toggle('playing');e.currentTarget.classList.toggle('paused',!d.classList.contains('playing'));});
// the deck: «another question» — the top card slides clear of the pile, then goes under it; the next is on top
const cycle=()=>{const dk=document.getElementById('deck');if(!dk)return;const top=dk.querySelector('[data-d="0"]');top.classList.add('out');
  setTimeout(()=>{dk.querySelectorAll('.card').forEach(c=>{if(c!==top)c.dataset.d=+c.dataset.d-1;});top.dataset.d=3;requestAnimationFrame(()=>top.classList.remove('out'));},700);};
document.querySelectorAll('[data-a],.keys .k').forEach(b=>{if(/другой вопрос/i.test(b.textContent))b.addEventListener('click',cycle);});
// the proof: each margin note beside its line, a thin line to the place
const proof=document.getElementById('proof');
if(proof){const lay=()=>{const R=proof.getBoundingClientRect(),svg=proof.querySelector('svg');let d='';let lastB=0;
  proof.querySelectorAll('.mn').forEach(m=>{const e=proof.querySelector(`.e[data-n="${m.dataset.n}"]`).getBoundingClientRect();let t=e.top-R.top-6;t=Math.max(t,lastB+6);m.style.top=t+'px';lastB=t+m.offsetHeight;
    const mx=R.width-22-m.offsetWidth-6,my=t+12;d+=`<path d="M${e.right-R.left+2} ${e.top-R.top+e.height*.55} C ${mx-30} ${e.top-R.top+e.height*.55}, ${mx-30} ${my}, ${mx} ${my}"/>`;});svg.innerHTML=d;};
  document.fonts.ready.then(()=>setTimeout(lay,400));
  document.querySelectorAll('.row[data-n]').forEach(r=>r.addEventListener('mouseenter',()=>{const n=r.dataset.n;document.querySelectorAll('.row,.e,.mn').forEach(x=>x.classList.toggle(x.classList.contains('row')?'on':'hl',x.dataset.n===n));}));}
</script></body></html>
