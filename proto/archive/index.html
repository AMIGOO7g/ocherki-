<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Архив семьи — проба</title>
<style>
/* Проба архива в языке стартовых шагов: тёмный туаль-стол, разделы — те же предметы, что в туре.
   Клик по разделу — предметы раскладываются на столе; клик по предмету — он открывается. Управление — чистое и современное. */
@font-face{font-family:"SignThatS";src:url("../../assets/fonts/SignThatS.otf") format("opentype");font-display:swap}
:root{--A:../../assets}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#140a04;color:#f3e3c8;font-family:"Iowan Old Style",Georgia,serif}
/* the night desk, the same layers as in the constructor */
.knight{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.knight>div{position:absolute;inset:0}
.nb{background:linear-gradient(180deg,#211006 0%,#1b0e06 36%,#150a04 72%,#0e0703 100%)}
.na{background:url("https://static.tildacdn.com/tild3564-6631-4539-a265-316165616139/photo.png") center/cover no-repeat;filter:brightness(.40) contrast(2) saturate(.58) sepia(.24);opacity:.54}
.nm{inset:-14% -12% -16% -14%!important;background:radial-gradient(ellipse 66% 60% at 49% 45%,rgba(236,168,91,.66) 0%,rgba(207,130,55,.55) 18%,rgba(164,88,27,.42) 38%,rgba(111,51,15,.27) 58%,rgba(62,27,9,.12) 75%,transparent 91%);filter:blur(56px);opacity:.88}
.nw{inset:-12% -8% -10% -12%!important;background:radial-gradient(ellipse 48% 44% at 41% 36%,rgba(244,187,112,.72) 0%,rgba(225,151,71,.62) 16%,rgba(190,111,39,.48) 34%,rgba(139,68,19,.31) 52%,rgba(82,37,11,.14) 70%,transparent 88%);filter:blur(66px);opacity:.9}
.ni{background:url("https://static.tildacdn.com/tild3564-6631-4539-a265-316165616139/photo.png") center/cover no-repeat;filter:grayscale(.08) brightness(.92) contrast(1.4) saturate(.36) sepia(.12);mix-blend-mode:multiply;opacity:.09}
.nv{inset:-6%!important;background:radial-gradient(circle at 0% 0%,rgba(0,0,0,.7) 0%,transparent 40%),radial-gradient(circle at 100% 0%,rgba(0,0,0,.76) 0%,transparent 42%),radial-gradient(circle at 0% 100%,rgba(0,0,0,.78) 0%,transparent 43%),radial-gradient(circle at 100% 100%,rgba(0,0,0,.84) 0%,transparent 44%),radial-gradient(ellipse 94% 86% at 46% 43%,transparent 40%,rgba(0,0,0,.28) 84%,rgba(0,0,0,.54) 100%)}
/* the top: a modern line, the title in the pen's hand */
header{position:fixed;left:0;right:0;top:14px;height:96px;display:flex;align-items:center;justify-content:center;z-index:5}
header h1{margin:0;font:400 58px/1 "SignThatS",Georgia,serif;color:#ffe2bd;text-shadow:0 0 18px rgba(255,150,60,.45)}
.back{position:fixed;left:28px;top:30px;z-index:6;height:42px;padding:0 20px 0 14px;border-radius:21px;border:1px solid rgba(214,150,96,.5);background:rgba(20,10,4,.55);color:#f2e0c2;font:italic 18px Georgia,serif;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s,box-shadow .5s}
.back.on{opacity:1;pointer-events:auto}.back:hover{box-shadow:0 0 14px 2px rgba(255,150,60,.4)}
.sub{position:fixed;left:0;right:0;top:104px;text-align:center;font:italic 19px Georgia,serif;color:#e2c9a2;z-index:5;transition:opacity .5s}
/* the six sections lie on the desk */
.desk{position:fixed;inset:150px 6vw 46px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:20px 30px;z-index:3;transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.3,1)}
.desk.away{opacity:0;transform:scale(.94);pointer-events:none}
.sec{position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;border-radius:18px;padding-bottom:10px;transition:background .5s}
.sec:hover{background:radial-gradient(ellipse 60% 55% at 50% 50%,rgba(255,170,90,.12),transparent 70%)}
.sec .obj{position:relative;flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;transition:transform .6s cubic-bezier(.2,.8,.3,1)}
.sec:hover .obj{transform:translateY(-6px) scale(1.03)}
.sec .obj>img{max-height:100%;max-width:80%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(0,0,0,.6))}
.sec b{font:400 22px/1.2 Georgia,serif;color:#fff2dc;letter-spacing:.01em}
.sec small{display:block;margin-top:3px;font:italic 15px Georgia,serif;color:#d6b78f}
.sec .new{position:absolute;top:10%;right:18%;padding:3px 10px;border-radius:12px;background:#b5522a;color:#fff;font:600 12px Arial,sans-serif;letter-spacing:.06em;box-shadow:0 0 12px rgba(255,120,60,.6)}
/* stacked objects */
.st3{position:relative;height:100%;aspect-ratio:1;max-width:100%}
.st3>*{position:absolute;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}
.ph{position:absolute;width:46%;aspect-ratio:900/1214}
.ph .pic{position:absolute;inset:6.5% 7%;background:center/cover;filter:sepia(.35) contrast(1.05)}
.ph .fr{position:absolute;inset:0;width:100%;height:100%}
.disc{position:absolute;width:62%;aspect-ratio:1}
.disc img{width:100%;height:100%}
.disc .lab{position:absolute;left:28.4%;top:28.4%;width:43.2%;height:43.2%;border-radius:50%;background:center/cover;filter:sepia(.45) brightness(.8)}
.disc .sh{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.9;pointer-events:none}
.card{position:absolute;width:62%;aspect-ratio:1.6;border-radius:6px;background:linear-gradient(170deg,#f6eddb,#e4d4b6);box-shadow:0 14px 26px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6%;text-align:center;color:#3b2a1c}
.card i{font:600 9px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#8a6a48;font-style:normal}
.card span{margin-top:6px;font:italic 15px/1.2 Georgia,serif}
/* the open section: its things spread on the desk */
.spread{position:fixed;inset:140px 5vw 40px;z-index:4;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:34px 40px;overflow:auto;padding:20px;opacity:0;pointer-events:none;transition:opacity .5s;scrollbar-width:thin;scrollbar-color:#6b4a2c transparent}
.spread.on{opacity:1;pointer-events:auto}
.it{position:relative;width:220px;cursor:pointer;text-align:center;opacity:0;transform:translateY(30px) rotate(var(--r,0deg));transition:opacity .6s ease var(--d,0s),transform .9s cubic-bezier(.2,.8,.3,1) var(--d,0s)}
.spread.on .it{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}
.it:hover .vis{transform:translateY(-6px) scale(1.04)}
.it .vis{position:relative;height:200px;display:flex;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.it .vis .ph{position:relative;width:auto;height:100%}
.it .vis .disc,.it .vis .card{position:relative;width:auto;height:auto}
.it .vis .disc{width:190px}
.it .vis .card{width:210px}
.it .vis>img{max-width:100%;max-height:100%;filter:drop-shadow(0 16px 20px rgba(0,0,0,.6))}
.it strong{display:block;margin-top:12px;font:400 18px/1.25 Georgia,serif;color:#fff2dc}
.it em{display:block;margin-top:3px;font:italic 14px Georgia,serif;color:#d6b78f}
.it .ans{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;width:300px;margin-left:-40px}
.it .ans u{text-decoration:none;white-space:nowrap;padding:3px 9px;border-radius:11px;background:rgba(255,200,140,.12);border:1px solid rgba(214,150,96,.4);font:13px Georgia,serif;color:#f0dcbc}
/* the opened thing */
.view{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,4,2,.7);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .5s}
.view.on{opacity:1;pointer-events:auto}
.view .x{position:absolute;right:28px;top:26px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(214,150,96,.5);background:rgba(20,10,4,.6);color:#f2e0c2;font:22px Georgia,serif;cursor:pointer}
.view .box{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
.view .cap{font:italic 20px Georgia,serif;color:#f0dcbc;text-align:center;max-width:70vw}
/* photo */
.view .bigph{position:relative;height:72vh;aspect-ratio:900/1214}
.view .bigph .pic{position:absolute;inset:6.5% 7%;background:center/cover;filter:sepia(.25)}
.view .bigph img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
/* letter: the envelope stays, the letter slides up out of it */
.view .lw{position:relative;width:min(640px,80vw);height:74vh}
.view .lw .env{position:absolute;left:0;right:0;bottom:0;width:100%;z-index:2;filter:drop-shadow(0 26px 34px rgba(0,0,0,.7));transition:transform 1s cubic-bezier(.2,.8,.3,1) .1s}
.view .lw .let{position:absolute;left:7%;right:7%;bottom:8%;height:86%;z-index:1;padding:8% 9%;background:url("../../assets/keeper/desk-paper.jpg") center/cover;color:#3b2a1c;font:400 22px/1.5 "SignThatS",Georgia,serif;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateY(40%);transition:transform 1.2s cubic-bezier(.2,.8,.3,1) .35s,z-index 0s .9s}
.view.on .lw .let{transform:translateY(0);z-index:3}
.view.on .lw .env{transform:translateY(32%)}
/* voice */
.view .bigdisc{position:relative;width:min(60vh,70vw);aspect-ratio:1}
.view .bigdisc .spin{position:absolute;inset:0;animation:sp 3.6s linear infinite}
.view .bigdisc .spin img{width:100%;height:100%}
.view .bigdisc .lab{position:absolute;left:28.4%;top:28.4%;width:43.2%;height:43.2%;border-radius:50%;background:center/cover;filter:sepia(.45) brightness(.82)}
.view .bigdisc .sh{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.9}
@keyframes sp{to{transform:rotate(360deg)}}
.player{display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:28px;background:rgba(20,10,4,.7);border:1px solid rgba(214,150,96,.4)}
.player button{width:42px;height:42px;border-radius:50%;border:0;background:#f3e3c8;cursor:pointer;display:grid;place-items:center}
.player button svg{width:16px;height:16px;fill:#2a1a10}
.player .wv{display:flex;align-items:center;gap:2px;height:30px}
.player .wv i{width:2px;border-radius:1px;background:#d9b98e;opacity:.7}
.player .wv i.p{background:#ffe2bd;opacity:1}
.player span{font:14px Georgia,serif;color:#d6b78f}
/* recording: the reels turn */
.view .rec{position:relative;width:min(56vh,70vw)}
.view .rec img{width:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.view .rec .reel{position:absolute;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,.22) 0 6%,transparent 6% 33%,rgba(255,255,255,.22) 33% 39%,transparent 39% 66%,rgba(255,255,255,.22) 66% 72%,transparent 72%);animation:sp 2.2s linear infinite;mix-blend-mode:screen}
/* text sheet */
.view .tx{width:min(620px,80vw);height:76vh;padding:56px 64px;background:url("../../assets/keeper/desk-paper.jpg") center/cover;color:#2a1c12;font:17px/1.6 Georgia,serif;box-shadow:0 30px 60px rgba(0,0,0,.6);overflow:auto}
.view .tx h3{margin:0 0 14px;font:400 30px "SignThatS",Georgia,serif;color:#4b3424}
/* question */
.view .qbig{width:min(560px,80vw);padding:40px 46px;border-radius:10px;background:linear-gradient(170deg,#f6eddb,#e4d4b6);color:#3b2a1c;box-shadow:0 30px 60px rgba(0,0,0,.6);text-align:center}
.view .qbig i{font:600 12px Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#8a6a48;font-style:normal}
.view .qbig h3{margin:12px 0 22px;font:italic 30px/1.25 Georgia,serif}
.view .qbig .a{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 0;border-top:1px solid rgba(120,84,50,.2)}
.view .qbig .a b{width:36px;height:36px;border-radius:50%;background:center/cover;flex:none}
.view .qbig .a span{font:16px/1.35 Georgia,serif}
.view .qbig .a small{display:block;color:#8a6a48;font:italic 13px Georgia,serif}
.hint{position:fixed;left:50%;bottom:12px;translate:-50% 0;font:italic 14px Georgia,serif;color:#b8977a;z-index:5}
</style>
</head>
<body>
<div class="knight"><div class="nb"></div><div class="na"></div><div class="nm"></div><div class="nw"></div><div class="ni"></div><div class="nv"></div></div>
<header><h1 id="ttl">Архив семьи</h1></header>
<div class="sub" id="sub">Всё, что присылают родные, — на одном столе</div>
<button class="back" id="back">‹ Архив</button>
<div class="desk" id="desk"></div>
<div class="spread" id="spread"></div>
<div class="view" id="view"><button class="x" id="x" aria-label="Закрыть">✕</button><div class="box" id="vbox"></div></div>
<div class="hint">Проба: клик по разделу — предметы раскладываются; клик по предмету — открывается. Esc — назад.</div>
<script>
const A='../../assets/',P='../../qa/demo-book/photos/';
const PHOTOS=[['grandma_porch','Бабушка на крыльце','Тифлис, 1956'],['mother_child_bw','Я с мамой','1956'],['lake_two','На озере','лето 1961'],['father_son_boat','Отец и сын','1964'],['girl_flowers','Варя с цветами','1968'],['family_sunset','Вся семья','1972']];
const LETTERS=[['Нина','Тифлис → Москва, 1957','Дорогие мои, пишу вам из Тифлиса… Здесь уже настоящая весна, в садах цветут абрикосы, и воздух такой тёплый, что невольно думаешь о доме. Серёжа вырос — вы его не узнаете. Целую всех крепко, ваша Нина'],['Николай','с фронта, 1944','Родные мои! Жив, здоров, не волнуйтесь. Вспоминаю наш двор и грушу под окном. Скоро увидимся.'],['Варвара','Кars, 1932','Милая сестра, посылаю тебе карточку, как обещала…']];
const VOICES=[['grandma_porch','Бабушка Нина','о трамвае, 2:28'],['nikolai_portrait','Дедушка Николай','о войне, 4:10'],['mother_daughter','Мама','колыбельная, 1:52']];
const RECS=[['Разговор на кухне','12 марта, 18:40'],['Тётя Варя о детстве','2 апреля, 11:05']];
const TEXTS=[['Детство','Мама впервые увидела трамвай, когда ей было шесть лет…'],['Переезд','В пятьдесят седьмом мы собрали всё в два чемодана…'],['Свадьба','Он пришёл на танцы в чужом пиджаке…']];
const QS=[['Как вы познакомились с дедушкой?','эта неделя',[['grandma_porch','Нина Петровна','голос · 2:28'],['mother_daughter','Мама','текст']]],['Какое блюдо в детстве было праздничным?','прошлая неделя',[['girl_flowers','Варя','фото']]]];
const ph=(f,r,x,y,w)=>`<div class="ph" style="left:${x}%;top:${y}%;${w?`width:${w}%;`:''}rotate:${r}deg"><i class="pic" style="background-image:url('${P}${f}.jpg')"></i><img class="fr" src="${A}archive/frame.webp" alt=""></div>`;
const disc=(f,x,y,w)=>`<div class="disc" style="left:${x}%;top:${y}%;${w?`width:${w}%`:''}"><img src="${A}keeper/desk-vinyl-disc.webp" alt=""><i class="lab" style="background-image:url('${P}${f}.jpg')"></i><img class="sh" src="${A}keeper/desk-vinyl-shine.webp" alt=""></div>`;
const card=(q,x,y,r)=>`<div class="card" style="left:${x}%;top:${y}%;rotate:${r}deg"><i>вопрос недели</i><span>${q}</span></div>`;
const SECS=[
  {k:'voices',t:'Голоса',n:`${VOICES.length} записи`,o:`<div class="st3">${disc('nikolai_portrait',30,8)}${disc('grandma_porch',8,22)}</div>`},
  {k:'photos',t:'Фото',n:`${PHOTOS.length} снимков`,o:`<div class="st3">${ph('lake_two',-9,46,4)}${ph('grandma_porch',6,12,12)}${ph('mother_child_bw',-3,30,22)}</div>`},
  {k:'letters',t:'Письма',n:`${LETTERS.length} письма`,o:`<img src="${A}archive/envelopes.webp" alt="">`,nw:1},
  {k:'recs',t:'Записи',n:`${RECS.length} записи`,o:`<img src="${A}archive/recorder.webp" alt="">`},
  {k:'texts',t:'Тексты',n:`${TEXTS.length} рассказа`,o:`<img src="${A}keeper/desk-stack.webp" alt="" style="filter:drop-shadow(0 18px 24px rgba(0,0,0,.6)) sepia(.6) saturate(1.3) hue-rotate(-10deg) brightness(.72)">`},
  {k:'qs',t:'Вопрос недели',n:'новый ответ',o:`<div class="st3">${card('Какое блюдо было праздничным?',-4,22,-6)}${card('Как вы познакомились с дедушкой?',6,44,3)}<img src="${A}keeper/tour-phone.webp" alt="" style="right:-14%;top:2%;height:70%;rotate:-12deg"></div>`,nw:1}];
const $=id=>document.getElementById(id);
$('desk').innerHTML=SECS.map(s=>`<div class="sec" data-k="${s.k}"><div class="obj">${s.o}</div>${s.nw?'<span class="new">новое</span>':''}<b>${s.t}</b><small>${s.n}</small></div>`).join('');
const wv=n=>Array.from({length:n},(_,k)=>`<i class="${k<n*.35?'p':''}" style="height:${(20+70*Math.abs(Math.sin(k*1.7)*Math.cos(k*.37))).toFixed(0)}%"></i>`).join('');
const items={
  photos:()=>PHOTOS.map(([f,t,y],i)=>({h:`<div class="ph" style="position:relative"><i class="pic" style="background-image:url('${P}${f}.jpg')"></i><img class="fr" src="${A}archive/frame.webp" alt=""></div>`,t,s:y,open:()=>`<div class="bigph"><i class="pic" style="background-image:url('${P}${f}.jpg')"></i><img src="${A}archive/frame.webp" alt=""></div><div class="cap">${t} · ${y}</div>`})),
  letters:()=>LETTERS.map(([w,y,tx])=>({h:`<img src="${A}archive/envelope.webp" alt="">`,t:`от ${w}`,s:y,open:()=>`<div class="lw"><div class="let">${tx}</div><img class="env" src="${A}archive/envelope.webp" alt=""></div><div class="cap">Письмо от ${w} · ${y}</div>`})),
  voices:()=>VOICES.map(([f,t,s])=>({h:disc(f,0,0).replace('style="left:0%;top:0%;"','style="position:relative"'),t,s,open:()=>`<div class="bigdisc"><div class="spin"><img src="${A}keeper/desk-vinyl-disc.webp" alt=""><i class="lab" style="background-image:url('${P}${f}.jpg')"></i></div><img class="sh" src="${A}keeper/desk-vinyl-shine.webp" alt=""></div><div class="player"><button aria-label="Пауза"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg></button><span class="wv">${wv(48)}</span><span>${s.split(', ')[1]||''}</span></div><div class="cap">${t} — ${s.split(', ')[0]}</div>`})),
  recs:()=>RECS.map(([t,s])=>({h:`<img src="${A}archive/recorder.webp" alt="">`,t,s,open:()=>`<div class="rec"><img src="${A}archive/recorder.webp" alt=""><i class="reel" style="left:21%;top:50.5%;width:22%;aspect-ratio:1"></i><i class="reel" style="left:49.5%;top:47%;width:22%;aspect-ratio:1"></i></div><div class="player"><button><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg></button><span class="wv">${wv(48)}</span><span>${s}</span></div><div class="cap">${t}</div>`})),
  texts:()=>TEXTS.map(([t,s])=>({h:`<div style="width:150px;height:200px;background:url('${A}keeper/desk-paper.jpg') center/cover;box-shadow:0 16px 22px rgba(0,0,0,.55);padding:18px 16px;text-align:left;color:#3b2a1c;font:11px/1.45 Georgia,serif"><b style="display:block;font:400 18px SignThatS,Georgia;margin-bottom:6px">${t}</b>${s}</div>`,t,s:'рассказ',open:()=>`<div class="tx"><h3>${t}</h3><p>${s} Они с бабушкой шли по Головинскому, и вдруг из-за угла выехал красный вагон, звенящий, как колокольчик.</p><p>Мама спряталась за бабушкину юбку, а потом весь вечер рассказывала соседям, что видела «дом на колёсах».</p></div>`})),
  qs:()=>QS.map(([q,w,ans])=>({h:card(q,0,0,0).replace('style="left:0%;top:0%;rotate:0deg"','style="position:relative"'),t:w,s:`${ans.length} ответа`,x:`<div class="ans">${ans.map(a=>`<u>${a[1]} · ${a[2].split(' ')[0]}</u>`).join('')}</div>`,open:()=>`<div class="qbig"><i>вопрос недели · ${w}</i><h3>${q}</h3>${ans.map(a=>`<div class="a"><b style="background-image:url('${P}${a[0]}.jpg')"></b><span>${a[1]}<small>${a[2]}</small></span></div>`).join('')}</div>`}))};
let cur=null,list=[];
const openSec=k=>{const s=SECS.find(x=>x.k===k);cur=k;list=items[k]();$('desk').classList.add('away');$('ttl').textContent=s.t;$('sub').textContent=s.n;$('back').classList.add('on');
  const sp=$('spread');sp.innerHTML=list.map((it,i)=>`<div class="it" data-i="${i}" style="--d:${(.08*i).toFixed(2)}s;--r:${((i*37%7)-3)*.8}deg"><div class="vis">${it.h}</div><strong>${it.t}</strong><em>${it.s}</em>${it.x||''}</div>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>sp.classList.add('on')));};
const closeSec=()=>{cur=null;$('spread').classList.remove('on');$('desk').classList.remove('away');$('ttl').textContent='Архив семьи';$('sub').textContent='Всё, что присылают родные, — на одном столе';$('back').classList.remove('on');};
const openIt=i=>{$('vbox').innerHTML=list[i].open();const v=$('view');v.classList.remove('on');void v.offsetWidth;requestAnimationFrame(()=>v.classList.add('on'));};
const closeIt=()=>$('view').classList.remove('on');
$('desk').addEventListener('click',e=>{const s=e.target.closest('.sec');if(s)openSec(s.dataset.k);});
$('spread').addEventListener('click',e=>{const it=e.target.closest('.it');if(it)openIt(+it.dataset.i);});
$('back').onclick=closeSec;$('x').onclick=closeIt;$('view').addEventListener('click',e=>{if(e.target.id==='view')closeIt();});
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('view').classList.contains('on'))closeIt();else if(cur)closeSec();}});
</script>
</body>
</html>
