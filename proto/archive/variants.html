<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Архив — варианты страницы предмета</title>
<style>
@font-face{font-family:"SignThatS";src:url("../../assets/fonts/SignThatS.otf") format("opentype");font-display:swap}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#140a04;color:#f3e3c8;font-family:"Iowan Old Style",Georgia,serif}
.knight{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.knight>div{position:absolute;inset:0}
.nb{background:linear-gradient(180deg,#211006 0%,#1b0e06 36%,#150a04 72%,#0e0703 100%)}
.na{background:url("https://static.tildacdn.com/tild3564-6631-4539-a265-316165616139/photo.png") center/cover no-repeat;filter:brightness(.40) contrast(2) saturate(.58) sepia(.24);opacity:.54}
.nm{inset:-14% -12% -16% -14%!important;background:radial-gradient(ellipse 66% 60% at 49% 45%,rgba(236,168,91,.66) 0%,rgba(207,130,55,.55) 18%,rgba(164,88,27,.42) 38%,rgba(111,51,15,.27) 58%,rgba(62,27,9,.12) 75%,transparent 91%);filter:blur(56px);opacity:.88}
.nw{inset:-12% -8% -10% -12%!important;background:radial-gradient(ellipse 48% 44% at 41% 36%,rgba(244,187,112,.72) 0%,rgba(225,151,71,.62) 16%,rgba(190,111,39,.48) 34%,rgba(139,68,19,.31) 52%,rgba(82,37,11,.14) 70%,transparent 88%);filter:blur(66px);opacity:.9}
.ni{background:url("https://static.tildacdn.com/tild3564-6631-4539-a265-316165616139/photo.png") center/cover no-repeat;filter:grayscale(.08) brightness(.92) contrast(1.4) saturate(.36) sepia(.12);mix-blend-mode:multiply;opacity:.09}
.nv{inset:-6%!important;background:radial-gradient(circle at 0% 0%,rgba(0,0,0,.7) 0%,transparent 40%),radial-gradient(circle at 100% 0%,rgba(0,0,0,.76) 0%,transparent 42%),radial-gradient(circle at 0% 100%,rgba(0,0,0,.78) 0%,transparent 43%),radial-gradient(circle at 100% 100%,rgba(0,0,0,.84) 0%,transparent 44%),radial-gradient(ellipse 94% 86% at 46% 43%,transparent 40%,rgba(0,0,0,.28) 84%,rgba(0,0,0,.54) 100%)}

/* the desk stays sharp, only a little dimmer: nothing is blurred behind the page */
.dim{position:fixed;inset:0;background:radial-gradient(ellipse 80% 70% at 45% 50%,rgba(0,0,0,.05),rgba(0,0,0,.45));pointer-events:none}
.top{position:fixed;left:28px;right:28px;top:22px;display:flex;justify-content:space-between;align-items:center;z-index:5;font:italic 17px Georgia,serif;color:#d9bf98}
.top .vb{display:flex;gap:6px}.top .vb a{padding:7px 14px;border-radius:16px;border:1px solid rgba(214,150,96,.4);color:#e9d3b0;text-decoration:none}.top .vb a.on{border-color:#ffd9a8;color:#fff;box-shadow:0 0 10px rgba(255,150,60,.4)}
.page{position:fixed;inset:80px 5vw 40px;display:grid;grid-template-columns:1.1fr 1fr;gap:5vw;align-items:center}
.obj{display:flex;align-items:center;justify-content:center;height:100%;min-height:0}
/* objects */
.bigph{position:relative;height:72vh;aspect-ratio:900/1214}
.bigph .pic{position:absolute;inset:6.5% 7%;background:center/cover;filter:sepia(.25)}
.bigph img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.bigdisc{position:relative;width:min(62vh,40vw);aspect-ratio:1}
.bigdisc .spin{position:absolute;inset:0;animation:sp 3.6s linear infinite}.bigdisc .spin img{width:100%;height:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.bigdisc .lab{position:absolute;left:28.4%;top:28.4%;width:43.2%;height:43.2%;border-radius:50%;background:center/cover;filter:sepia(.45) brightness(.82)}
.bigdisc .sh{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.9}
@keyframes sp{to{transform:rotate(360deg)}}
.eq{flex:1;display:flex;align-items:center;gap:3px;height:44px}.eq i{flex:1;height:100%;border-radius:2px;transform:scaleY(.1);animation:eq var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes eq{to{transform:scaleY(var(--h))}}
/* the shared modern keys (on the desk, under the description) */
.keys{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.k{height:44px;padding:0 22px;border-radius:22px;border:1px solid rgba(214,150,96,.55);background:none;color:#f2e0c2;font:italic 17px Georgia,serif;cursor:pointer}
.k.main{border-color:rgba(255,206,150,.95);color:#ffe9c9;box-shadow:0 0 12px 2px rgba(255,150,60,.45)}
.nav{display:flex;align-items:center;gap:16px;margin-top:16px;font:italic 15px Georgia,serif;color:#c99a6a}.nav b{font-weight:400;cursor:pointer;color:#e9d3b0}

/* ===== A — a sheet of laid paper: an inventory note lying beside the object ===== */
.A .sheet{position:relative;padding:44px 48px 40px;background:url("../../assets/keeper/desk-paper.jpg") center/cover;color:#2a1c12;box-shadow:0 2px 3px rgba(0,0,0,.3),0 30px 50px rgba(0,0,0,.55);rotate:1.2deg}
.A .sheet::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 110% at 0% 0%,rgba(255,240,215,.18),transparent 55%),linear-gradient(135deg,transparent 50%,rgba(60,35,15,.22))}
.A .kk{font:700 12px "Courier New",monospace;letter-spacing:.2em;text-transform:uppercase;color:#7a5a3a}
.A h2{margin:22px 0 18px;font:400 50px/1.05 "SignThatS",Georgia,serif;color:#3b2a1c}
.A dl{display:grid;grid-template-columns:120px 1fr;gap:9px 14px;margin:0;padding:16px 0;border-top:1px solid rgba(90,60,30,.3);border-bottom:1px solid rgba(90,60,30,.3);font:700 15px/1.4 "Courier New",monospace}
.A dt{color:#7a5a3a}.A dd{margin:0;color:#1f140c}
.A .story{margin:16px 0 0;font:400 22px/1.4 "SignThatS",Georgia,serif;color:#3b2a1c}
.A .pl{display:flex;align-items:center;gap:14px;margin:4px 0 6px}.A .pp{width:50px;height:50px;border-radius:50%;background:#2a1c12;display:grid;place-items:center;flex:none}.A .pp::after{content:"";border-left:4px solid #f3e3c8;border-right:4px solid #f3e3c8;width:5px;height:16px}
.A .eq i{background:#5a3e28;opacity:.8}
.A .tm{display:flex;justify-content:space-between;font:700 13px "Courier New",monospace;color:#7a5a3a;margin-bottom:12px}

/* ===== B — museum catalogue: no panel, the words on the desk, much air, a thin gilt rule ===== */
.B .info{padding-left:6px}
.B .kk{font:500 12px "Iowan Old Style",Georgia,serif;letter-spacing:.42em;text-transform:uppercase;color:#d8b47e}
.B h2{margin:30px 0 6px;font:400 64px/1 "SignThatS",Georgia,serif;color:#fff2dc;text-shadow:0 0 22px rgba(255,160,70,.25)}
.B .sub{font:italic 22px Georgia,serif;color:#e9cfa6}
.B .rule{width:120px;height:1px;margin:28px 0;background:linear-gradient(90deg,#e8c58e,rgba(232,197,142,0))}
.B dl{display:grid;grid-template-columns:auto 1fr;gap:12px 28px;margin:0;font:18px/1.35 Georgia,serif}
.B dt{font:500 11px "Iowan Old Style",Georgia,serif;letter-spacing:.3em;text-transform:uppercase;color:#bf9a6c;padding-top:5px}.B dd{margin:0;color:#f6e8d2}
.B .story{margin:28px 0 0;max-width:460px;font:italic 20px/1.55 Georgia,serif;color:#ead6b4}
.B .pl{display:flex;align-items:center;gap:18px;margin:6px 0 8px}.B .pp{width:58px;height:58px;border-radius:50%;border:1px solid #e8c58e;display:grid;place-items:center;box-shadow:0 0 18px rgba(255,170,90,.35)}.B .pp::after{content:"";border-left:4px solid #ffe9c9;border-right:4px solid #ffe9c9;width:5px;height:16px}
.B .eq i{background:linear-gradient(#ffe2b8,#e08a3c);opacity:.8}
.B .tm{display:flex;justify-content:space-between;font:italic 14px Georgia,serif;color:#c99a6a;max-width:460px}
.B .k{border-color:rgba(232,197,142,.35)}

/* ===== C — an index card from the family card file: typed fields, a red ruled head ===== */
.C .card{position:relative;padding:30px 36px 30px;background:linear-gradient(180deg,#f2ead8,#e7dcc4);color:#2a1c12;border-radius:4px;box-shadow:0 2px 3px rgba(0,0,0,.3),0 28px 46px rgba(0,0,0,.55);rotate:-1deg;
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,rgba(70,110,160,.22) 33px 34px),linear-gradient(180deg,#f2ead8,#e7dcc4)}
.C .card::before{content:"";position:absolute;left:0;right:0;top:78px;height:2px;background:rgba(170,40,40,.55)}
.C .card .hole{position:absolute;left:50%;bottom:14px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#140a04;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.C .kk{display:flex;justify-content:space-between;font:700 13px "Courier New",monospace;color:#8a3a2a;letter-spacing:.08em}
.C h2{margin:8px 0 22px;font:700 28px/1.2 "Courier New",monospace;color:#1f140c}
.C dl{display:grid;grid-template-columns:130px 1fr;gap:0 10px;margin:0;font:700 15px/34px "Courier New",monospace}
.C dt{color:#6a4a32}.C dd{margin:0}
.C .story{margin:0;font:700 15px/34px "Courier New",monospace;color:#2a1c12;padding-bottom:30px}
.C .pl{display:flex;align-items:center;gap:12px;margin:0 0 4px}.C .pp{width:44px;height:44px;border-radius:50%;background:#8a3a2a;display:grid;place-items:center;flex:none}.C .pp::after{content:"";border-left:4px solid #fff;border-right:4px solid #fff;width:4px;height:14px}
.C .eq i{background:#6a4a32;opacity:.75}
.C .tm{display:flex;justify-content:space-between;font:700 13px "Courier New",monospace;color:#6a4a32;line-height:34px}

/* ===== D — exhibition: the object large in the middle, a small wall label beside it ===== */
.D .page{grid-template-columns:1.6fr 1fr}
.D .label{max-width:400px;padding:26px 28px;background:#f4ede0;color:#1f140c;box-shadow:0 1px 2px rgba(0,0,0,.4),0 18px 30px rgba(0,0,0,.45);border-left:6px solid #a8302a}
.D .kk{font:600 11px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8a6a48}
.D h2{margin:8px 0 2px;font:600 26px/1.2 Georgia,serif;color:#1f140c}
.D .sub{font:italic 17px Georgia,serif;color:#5a4030;margin-bottom:14px}
.D dl{margin:0;font:14px/1.6 Georgia,serif}.D dt{display:inline;color:#8a6a48}.D dt::after{content:": "}.D dd{display:inline;margin:0}.D dd::after{content:"";display:block}
.D .story{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(90,60,30,.25);font:15px/1.55 Georgia,serif;color:#2a1c12}
.D .pl{display:flex;align-items:center;gap:12px;margin:6px 0}.D .pp{width:42px;height:42px;border-radius:50%;background:#1f140c;display:grid;place-items:center;flex:none}.D .pp::after{content:"";border-left:3px solid #fff;border-right:3px solid #fff;width:4px;height:13px}
.D .eq{height:30px}.D .eq i{background:#8a6a48;opacity:.8}
.D .tm{display:flex;justify-content:space-between;font:13px Georgia,serif;color:#8a6a48}
</style></head><body>
<div class="knight"><div class="nb"></div><div class="na"></div><div class="nm"></div><div class="nw"></div><div class="ni"></div><div class="nv"></div></div><div class="dim"></div>
<div class="top"><span>‹ Архив · Фото</span><span class="vb" id="vb"></span><span>✕</span></div>
<div id="root"></div>
<script>
const A='../../assets/',P='../../qa/demo-book/photos/';
const q=new URLSearchParams(location.search),V=q.get('v')||'A',T=q.get('t')||'photo';
document.body.className=V;
document.getElementById('vb').innerHTML=['A','B','C','D'].map(v=>`<a class="${v===V?'on':''}" href="?v=${v}&t=${T}">${v}</a>`).join('')+`<a href="?v=${V}&t=${T==='photo'?'voice':'photo'}">${T==='photo'?'голос':'фото'}</a>`;
const eq=n=>`<div class="eq">${Array.from({length:n},(_,k)=>`<i style="--h:${(.25+.75*Math.abs(Math.sin(k*1.9))).toFixed(2)};--d:${(.45+(k*37%9)/16).toFixed(2)}s;--dl:-${((k*53%17)/10).toFixed(2)}s"></i>`).join('')}</div>`;
const D=T==='photo'?{kk:'фото',t:'Бабушка на крыльце',sub:'Тифлис, 1956',rows:[['год','1956'],['место','Тифлис, Плехановский'],['на фото','Нина Петровна, Серёжа'],['прислала','тётя Варя, 3 мая']],story:'«Это наше крыльцо на Плехановском. Бабушка всегда сидела здесь по вечерам, а мы с Серёжей бегали вокруг…»',
  obj:`<div class="bigph"><i class="pic" style="background-image:url('${P}grandma_porch.jpg')"></i><img src="${A}archive/frame.webp" alt=""></div>`,play:''}
 :{kk:'голос',t:'Бабушка Нина',sub:'о трамвае',rows:[['записано','12 марта 2026'],['длится','3 мин 14 с'],['в книге','QR у главы «Детство»']],story:'«Мне было шесть лет, когда я впервые увидела трамвай. Мы с бабушкой шли по Головинскому…»',
  obj:`<div class="bigdisc"><div class="spin"><img src="${A}keeper/desk-vinyl-disc.webp" alt=""><i class="lab" style="background-image:url('${P}grandma_porch.jpg')"></i></div><img class="sh" src="${A}keeper/desk-vinyl-shine.webp" alt=""></div>`,
  play:`<div class="pl"><span class="pp"></span>${eq(30)}</div><div class="tm"><span>0:46</span><span>осталось 2:28</span></div>`};
const dl=`<dl>${D.rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const keys=`<div class="keys"><button class="k main">В книгу</button><button class="k">Изменить</button></div><div class="nav"><b>‹ предыдущее</b><span>1 из 6</span><b>следующее ›</b></div>`;
const R={
  A:`<div class="info"><div class="sheet"><div class="kk">${D.kk} · №17</div><h2>${D.t}</h2>${D.play}${dl}<p class="story">${D.story}</p></div>${keys}</div>`,
  B:`<div class="info"><div class="kk">${D.kk}</div><h2>${D.t}</h2><div class="sub">${D.sub}</div><div class="rule"></div>${D.play}${dl}<p class="story">${D.story}</p>${keys}</div>`,
  C:`<div class="info"><div class="card"><div class="kk"><span>АРХИВ СЕМЬИ</span><span>№ 017</span></div><h2>${D.t}</h2>${D.play}${dl}<p class="story">${D.story}</p><i class="hole"></i></div>${keys}</div>`,
  D:`<div class="info"><div class="label"><div class="kk">${D.kk}</div><h2>${D.t}</h2><div class="sub">${D.sub}</div>${D.play}${dl}<p class="story">${D.story}</p></div>${keys}</div>`};
document.getElementById('root').innerHTML=`<div class="page"><div class="obj">${D.obj}</div>${R[V]}</div>`;
</script></body></html>
