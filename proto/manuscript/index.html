<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рукопись — проба</title>
<style>
@font-face{font-family:"SignThatS";src:url("../../assets/fonts/SignThatS.otf") format("opentype");font-display:swap}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#140a04;color:#f3e3c8;font-family:"Iowan Old Style",Georgia,serif}
.knight{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.knight>div{position:absolute;inset:0}
.nb{background:linear-gradient(180deg,#211006 0%,#1b0e06 36%,#150a04 72%,#0e0703 100%)}
.na{background:url("https://static.tildacdn.com/tild3564-6631-4539-a265-316165616139/photo.png") center/cover no-repeat;filter:brightness(.40) contrast(2) saturate(.58) sepia(.24);opacity:.54}
.nm{inset:-14% -12% -16% -14%!important;background:radial-gradient(ellipse 66% 60% at 49% 45%,rgba(236,168,91,.66) 0%,rgba(207,130,55,.55) 18%,rgba(164,88,27,.42) 38%,rgba(111,51,15,.27) 58%,rgba(62,27,9,.12) 75%,transparent 91%);filter:blur(56px);opacity:.88}
.nw{inset:-12% -8% -10% -12%!important;background:radial-gradient(ellipse 48% 44% at 41% 36%,rgba(244,187,112,.72) 0%,rgba(225,151,71,.62) 16%,rgba(190,111,39,.48) 34%,rgba(139,68,19,.31) 52%,rgba(82,37,11,.14) 70%,transparent 88%);filter:blur(66px);opacity:.9}
.ni{background:url("https://static.tildacdn.com/tild3564-6631-4539-a265-316165616139/photo.png") center/cover no-repeat;filter:grayscale(.08) brightness(.92) contrast(1.4) saturate(.36) sepia(.12);mix-blend-mode:multiply;opacity:.09}
.nv{inset:-6%!important;background:radial-gradient(circle at 0% 0%,rgba(0,0,0,.7) 0%,transparent 40%),radial-gradient(circle at 100% 0%,rgba(0,0,0,.76) 0%,transparent 42%),radial-gradient(circle at 0% 100%,rgba(0,0,0,.78) 0%,transparent 43%),radial-gradient(circle at 100% 100%,rgba(0,0,0,.84) 0%,transparent 44%),radial-gradient(ellipse 94% 86% at 46% 43%,transparent 40%,rgba(0,0,0,.28) 84%,rgba(0,0,0,.54) 100%)}

header{position:fixed;left:0;right:0;top:26px;text-align:center;z-index:5}
header h1{margin:0;font:400 58px/1.1 "SignThatS",Georgia,serif;color:#ffe2bd;text-shadow:0 0 18px rgba(255,150,60,.45)}
header p{margin:4px 0 0;font:italic 19px Georgia,serif;color:#e2c9a2}
.tabs{position:fixed;left:50%;top:128px;translate:-50% 0;display:flex;gap:8px;z-index:5}
.tabs button{height:38px;padding:0 18px;border-radius:19px;border:1px solid rgba(214,150,96,.45);background:none;color:#e9d3b0;font:italic 16px Georgia,serif}
.tabs button.on{border-color:rgba(255,206,150,.95);color:#ffe9c9;box-shadow:0 0 12px 2px rgba(255,150,60,.4)}
/* the chapters: a stack of laid sheets each, lit by the lamp from the upper left */
.desk{position:fixed;inset:200px 5vw 40px;overflow:auto;padding-top:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:70px 30px;align-content:start;justify-items:center;z-index:3}
.ch{position:relative;width:min(180px,14vw);aspect-ratio:1/1.414;cursor:pointer;transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.ch:hover{transform:translateY(-8px) rotate(var(--r))}
.ch{transform:rotate(var(--r))}
.ch .s{position:absolute;inset:0;background:url("../../assets/keeper/desk-paper-small.jpg") center/cover;filter:sepia(.18) brightness(.93);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.ch .s.u1{transform:translate(5px,4px) rotate(1.6deg);filter:brightness(.78) sepia(.3)}
.ch .s.u2{transform:translate(9px,8px) rotate(-1.2deg);filter:brightness(.68) sepia(.35)}
.ch .s.top{padding:18% 12% 10%;color:#2a1c12;overflow:hidden;box-shadow:0 18px 26px rgba(0,0,0,.55)}
/* the lamp on the top sheet: lighter at the upper left, a soft shade to the lower right */
.ch .s.top::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 110% at 0% 0%,rgba(255,240,215,.22),transparent 55%),linear-gradient(135deg,transparent 55%,rgba(60,35,15,.22));pointer-events:none}
.ch .n{font:600 9px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#8a6a48}
.ch h3{margin:6px 0 8px;font:400 26px/1.1 "SignThatS",Georgia,serif;color:#3b2a1c}
.ch p{margin:0;font:700 9.5px/1.5 "Courier New",monospace;color:#2a1c12;opacity:.85}
.ch .pg{position:absolute;right:10%;bottom:6%;font:italic 11px Georgia,serif;color:#8a6a48}
.ch .em{position:absolute;left:50%;top:6%;width:16%;translate:-50% 0;opacity:.18;filter:sepia(1) brightness(.6)}
/* the ribbon bookmark of a chosen chapter */
.ch .rib{position:absolute;top:-6px;right:16%;width:16px;height:46%;background:linear-gradient(90deg,#6e1712,#a8302a 45%,#7a1b15);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);box-shadow:2px 3px 6px rgba(0,0,0,.4);z-index:3}
.ch .rib.g{background:linear-gradient(90deg,#7a5a1a,#c9a24a 45%,#86621f)}
.ch b.cap{position:absolute;left:0;right:0;top:calc(100% + 14px);text-align:center;font:400 17px Georgia,serif;color:#fff2dc}
.ch b.cap small{display:block;font:italic 13px Georgia,serif;color:#d6b78f}
.ch.add .s{background:none;border:1.5px dashed rgba(214,150,96,.5);display:grid;place-items:center;color:#e2c9a2;font:italic 17px Georgia,serif;box-shadow:none}
</style></head><body>
<div class="knight"><div class="nb"></div><div class="na"></div><div class="nm"></div><div class="nw"></div><div class="ni"></div><div class="nv"></div></div>
<header><h1>Рукопись</h1><p>Все главы книги — листами на столе</p></header>
<div class="tabs"><button class="on">Главы</button><button>Все листы</button><button>Без главы</button></div>
<div class="desk" id="desk"></div>
<script>
const CH=[['глава 1','Детство','Мама впервые увидела трамвай, когда ей было шесть лет. Они с бабушкой шли по Головинскому…',12,'r'],['глава 2','Тифлис','Летом мы жили у тёти Вари на Плехановском, в комнате с окном во двор, где росла старая груша…',9,''],['глава 3','Война','Отец уходил рано, а возвращался затемно. Письма с фронта приходили редко, и каждое…',14,'g'],['глава 4','Переезд','В пятьдесят седьмом мы собрали всё в два чемодана и поехали в Москву…',7,''],['глава 5','Свадьба','Он пришёл на танцы в чужом пиджаке, на два размера больше…',6,'r'],['глава 6','Дети','Серёжа родился в марте, в самую распутицу…',4,''],['глава 7','Дача','',0,'']];
document.getElementById('desk').innerHTML=CH.map(([n,t,x,p,rb],i)=>`<div class="ch" style="--r:${((i*37%7)-3)*.6}deg"><i class="s u2"></i><i class="s u1"></i><div class="s top"><div class="n">${n}</div><h3>${t}</h3><p>${x||''}</p>${p?`<span class="pg">${p} листов</span>`:''}</div>${rb?`<i class="rib ${rb==='g'?'g':''}"></i>`:''}<b class="cap">${t}<small>${p?p+' листов':'пустая глава'}</small></b></div>`).join('')+`<div class="ch add"><div class="s">+ глава</div></div>`;
</script></body></html>
