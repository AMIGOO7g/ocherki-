<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Очерки жизни — Master Proof V16</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="design-pack-01.css?v=dom-flow-20260908">
  <style>
    :root{--book-page-w:1000px;--book-page-h:1000px;--proof-scale:.43}
    *{box-sizing:border-box}
    body{margin:0;background:#d8d4cc;color:#181714;font-family:Arial,sans-serif}
    .proof-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 28px;background:rgba(24,23,20,.95);color:#fff}
    .proof-head h1{margin:0;font:500 24px/1.1 'CormorantCy',Georgia,serif;letter-spacing:.05em}
    .proof-head p{margin:4px 0 0;color:#bdb6aa;font-size:12px}
    .format-switch{display:flex;gap:8px}
    .format-switch button{border:1px solid rgba(255,255,255,.24);background:transparent;color:#ddd5c8;padding:8px 12px;border-radius:20px;cursor:pointer}
    .format-switch button.active{border-color:#c9aa78;background:#8a7454;color:#fff}
    .proof-list{max-width:1040px;margin:0 auto;padding:30px 26px 70px;display:grid;gap:34px}
    .proof-case{background:#eeeae3;padding:18px;border:1px solid rgba(24,23,20,.10)}
    .proof-meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}
    .proof-meta strong{font:600 16px/1.2 'CormorantCy',Georgia,serif;letter-spacing:.04em}
    .proof-meta span{font-size:11px;color:#776e62;text-align:right}
    .proof-spread{position:relative;width:100%;height:calc(var(--book-page-h)*var(--proof-scale));display:grid;grid-template-columns:1fr 1fr;background:#fff;overflow:hidden;box-shadow:0 8px 28px rgba(24,23,20,.16)}
    .proof-spread::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(0,0,0,.22);z-index:5}
    .proof-page{position:relative;overflow:hidden;background:#fff}
    .proof-canvas{position:absolute;left:0;top:0;width:1000px;height:var(--book-page-h);transform:scale(var(--proof-scale));transform-origin:top left}
    @media(max-width:760px){:root{--proof-scale:.31}.proof-head{align-items:flex-start;flex-direction:column}.proof-list{padding:18px 8px}.proof-case{padding:10px}}
  </style>
</head>
<body>
  <header class="proof-head">
    <div><h1>Master Proof V16</h1><p>Существующие и дополнительные композиции Design Pack 01</p></div>
    <div class="format-switch" aria-label="Формат книги">
      <button type="button" class="active" data-format="square">280 × 280</button>
      <button type="button" data-format="portrait">280 × 335</button>
    </div>
  </header>
  <main class="proof-list" id="proofList"></main>
  <script src="design-pack-01.js?v=dom-flow-20260908"></script>
  <script>
  (()=>{
    const photos=[
      '../qa/assets/photo_man.jpg','../qa/assets/photo_walk.jpg','../qa/assets/photo_city.jpg','../qa/assets/photo_window.jpg',
      '../qa/assets/photo_laundry.jpg','../qa/assets/photo_double.jpg','../qa/assets/photo_camera.jpg','../qa/assets/photo_portrait.jpg'
    ].map((src,index)=>({src,caption:`Фотография ${index+1} · семейный архив`}));
    const paragraph='Семейная история складывается из множества точных деталей. В памяти остаются дорога, дом, голоса близких, старые письма и фотографии. Каждое свидетельство занимает своё место, а спокойный книжный ритм помогает читать рассказ последовательно и без спешки. ';
    const text=n=>Array.from({length:n},()=>paragraph).join('');
    const source={title:'Возвращение',episode:'Поворот тропы',text:text(14),photos,inferred:{date:'1987—1992',place:'Тбилиси'}};
    const p=(kind,layout,master,extra={})=>Object.assign({kind,layout,master,source,title:'Поворот тропы',episode:'Семейная хроника',text:text(5),pageNo:12},extra);
    const cases=[
      {id:'D01-CHAPTER-INITIAL',name:'Инициальная вставка',note:'Открытие главы: крупная буква обрезается вертикальной линией, текст начинается на её высоте',left:p('chapter-initial','chapter-initial','D01-CHAPTER-INITIAL',{initialLetter:'С',initialText:'Семейная память начинается с голоса, который возвращает рассказу его первое дыхание.',quote:'Семейная память начинается с голоса.'}),right:p('chapter','chapter-intro','D01-CHAPTER-TEXT',{chapterNo:1,text:text(2)})},
      {id:'D01-TEXT-IMPORTANT',name:'Важная строка',note:'Курсивная строка немного крупнее основного текста внутри той же колонки',left:p('text','prose-dense','D01-TEXT-IMPORTANT',{rhythm:'important',text:text(8),importantLine:'Самое важное в этой истории сохраняется не в датах, а в голосе семьи.'}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-TEXT-MARGIN',name:'Заметка на внешнем поле',note:'Вертикальная рукописная помета вдоль внешнего края, без подчёркивания',left:p('text','prose-dense','D01-TEXT-MARGIN',{rhythm:'margin',text:text(8),marginNote:'Эта деталь возвращает рассказ к дому и голосу семьи.'}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-TEXT-INLINE-QUOTE',name:'Цитата внутри повествования',note:'Цитата разбивает поток внутри двухколоночного текста без подписи',left:p('text','prose-dense','D01-TEXT-INLINE-QUOTE',{rhythm:'inline-quote',text:text(8),inlineQuote:'Память возвращает дому человеческий голос.'}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-TEXT-IMPORTANT-MARGIN',name:'Важная строка + заметка',note:'Дополнительный текстовый вариант: два акцента работают вместе на одном развороте',left:p('text','prose-dense','D01-TEXT-IMPORTANT-MARGIN',{rhythm:'important-margin',text:text(8),importantLine:'Самое важное остаётся в памяти семьи.',marginNote:'Эту деталь нужно сохранить для следующего поколения.'}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-CHAPTER',name:'Открытие главы',note:'Фотография и титульная текстовая страница',left:p('chapter','chapter-photo','D01-CHAPTER-PHOTO',{photoIndex:0}),right:p('chapter','chapter-intro','D01-CHAPTER-TEXT',{chapterNo:1,text:text(2)})},
      {id:'D01-SPREAD-TEXT',name:'Полный текстовый разворот',note:'Текст заполняет рабочую высоту страницы',left:p('text','prose-dense','D01-TEXT',{text:text(9),showHeading:true,sectionTitle:'Новый эпизод'}),right:p('text','prose-dense','D01-TEXT',{text:text(10)})},
      {id:'D01-SPREAD-TEXT-QUOTE',name:'Текст с внутренней вставкой',note:'Цитата появляется внутри набора, а не только сверху',left:p('text','prose-dense','D01-TEXT-QUOTE',{text:text(9),pullQuote:'Самое важное остаётся в памяти семьи.'}),right:p('text','prose-dense','D01-TEXT',{text:text(10)})},
      {id:'D01-SPREAD-DARK-TEXT',name:'Тёмная текстовая пауза',note:'Редкая композиция с белым набором',left:p('dark-text','dark-text','D01-DARK-TEXT',{text:text(8),pullQuote:'Голос прошлого становится частью настоящего.'}),right:p('text','prose-dense','D01-TEXT',{text:text(10)})},
      {id:'D01-SPREAD-DARK-TEXT-PAIR',name:'Разворот из двух тёмных страниц',note:'Обычный текст без цитаты; две колонки на каждой странице',continuous:true,left:p('dark-text','dark-text','D01-DARK-TEXT',{text:text(9)}),right:p('dark-text','dark-text','D01-DARK-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-QUOTE-LIGHT',name:'Светлая цитатная страница',note:'Полный лист с цитатой в цвете заголовков; тёмная версия остаётся отдельным вариантом',left:p('quote','quote','D01-QUOTE',{quote:'Память не заполняет страницу — она задаёт ей ритм.',quoteTone:'light',text:''}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-PANORAMA',name:'Одна горизонтальная фотография на оба листа',note:'Один source/photoIndex на левой и правой странице; применение необязательно',continuous:true,left:p('photo','panorama','D01-PANORAMA',{photoIndex:2,panorama:true,panoramaSide:'left'}),right:p('photo','panorama','D01-PANORAMA',{photoIndex:2,panorama:true,panoramaSide:'right',hideCaption:true})},
      {id:'D01-SPREAD-PHOTO-RAIL',name:'Фото на 1,5 листа + текстовая колонка справа',note:'Один источник продолжается на большой странице и половине соседнего листа; только горизонтальное фото',continuous:true,left:p('photo-rail-image','photo-rail-image','D01-PHOTO-RAIL',{photoIndex:2,railSide:'right'}),right:p('photo-rail-text','photo-rail-text','D01-PHOTO-RAIL',{photoIndex:2,railSide:'right',text:text(4),sectionTitle:'The Unique Signature'})},
      {id:'D01-SPREAD-PHOTO-RAIL-MIRROR',name:'Фото на 1,5 листа + текстовая колонка слева',note:'Зеркальный вариант той же композиции с сохранением внутренних отступов',continuous:true,left:p('photo-rail-text','photo-rail-text','D01-PHOTO-RAIL',{photoIndex:3,railSide:'left',text:text(4),sectionTitle:'Finishing touches'}),right:p('photo-rail-image','photo-rail-image','D01-PHOTO-RAIL',{photoIndex:3,railSide:'left'})},
      {id:'D01-SPREAD-BLEED-TEXT',name:'Фото заходит на соседний лист',note:'Изображение проходит через корешок, справа остаётся текстовая полоса',continuous:true,left:p('bleed-text','bleed-text','D01-BLEED-TEXT',{photoIndex:2,bleedSide:'left'}),right:p('bleed-text','bleed-text','D01-BLEED-TEXT',{photoIndex:2,bleedSide:'right',text:text(2)})},
      {id:'D01-SPREAD-TWO-PHOTO',name:'Два фото — по одному на страницу',note:'Спокойный фотографический разворот',left:p('photo','photo-fullspread','D01-LARGE-PHOTO',{photoIndex:1}),right:p('photo','photo-fullspread','D01-LARGE-PHOTO',{photoIndex:3})},
      {id:'D01-SPREAD-DUO',name:'Две фотографии на одном листе',note:'Вторая страница сохраняет текстовый ритм',left:p('two-photo','photo-duo','D01-TWO-PHOTO',{photoIndices:[1,3]}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-THREE-PHOTO',name:'Три фотографии на одном листе',note:'Не ставится рядом с другим триптихом или мозаикой',left:p('three-photo','photo-triptych','D01-THREE-PHOTO',{photoIndices:[1,3,5]}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-STACKED-TEXT',name:'Два фото вертикально + текст',note:'Композиция из присланного образца',left:p('stacked-text','stacked-text','D01-STACKED-TEXT',{photoIndices:[1,3],text:text(3)}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-MOSAIC',name:'Редакционная фотомозаика',note:'От 5 до 12 фотографий; используется редко',left:p('mosaic','mosaic','D01-MOSAIC',{photoIndices:[0,1,2,3,4,5,6,7]}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-PHOTO-OVER-TEXT',name:'Фото сверху, текст снизу',note:'Существующая композиция сохранена',left:p('photo-over-text','photo-over-text','D01-PHOTO-OVER-TEXT',{photoIndex:3,text:text(3),sectionTitle:'Дом у реки'}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-TEXT-OVER-PHOTO',name:'Текст сверху, фото снизу',note:'Обратный вариант из присланных образцов',left:p('text-over-photo','text-over-photo','D01-TEXT-OVER-PHOTO',{photoIndex:5,text:text(3),sectionTitle:'Последние штрихи'}),right:p('photo','photo-fullspread','D01-LARGE-PHOTO',{photoIndex:3})},
      {id:'D01-SPREAD-PHOTO-OVER-TEXT-LARGE',name:'Фото сверху и крупное фото напротив',note:'Дополнительный разворот по образцу: фото, заголовок и две колонки + крупный кадр',left:p('photo-over-text','photo-over-text','D01-PHOTO-OVER-TEXT',{photoIndex:3,text:text(3),sectionTitle:'Signature'}),right:p('photo','photo-fullspread','D01-LARGE-PHOTO',{photoIndex:6})},
      {id:'D01-SPREAD-TEXT-OVER-PHOTO-LARGE',name:'Текст сверху, фото снизу и крупный кадр напротив',note:'Зеркальное дополнение к предыдущей композиции',left:p('text-over-photo','text-over-photo','D01-TEXT-OVER-PHOTO',{photoIndex:5,text:text(3),sectionTitle:'Finishing touches'}),right:p('photo','photo-fullspread','D01-LARGE-PHOTO',{photoIndex:7})},
      {id:'D01-SPREAD-PHOTO-SIDE-TEXT',name:'Фото слева, текст справа на листе',note:'С нашими внутренними полями и подписью',left:p('photo-side-text','photo-side-text','D01-PHOTO-SIDE-TEXT',{photoIndex:7,text:text(4),sectionTitle:'Семейный портрет'}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-DARK-SPLIT',name:'Тёмный текст + фотография',note:'Редкая акцентная страница',left:p('dark-split','dark-split','D01-DARK-SPLIT',{photoIndex:6,text:text(2)}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-DARK-PHOTO-PAIR',name:'Тёмный разворот: фото и текст на обеих страницах',note:'Два тёмных листа, у каждого своё фото и текст; используется редко',continuous:true,left:p('dark-split','dark-split','D01-DARK-SPLIT',{photoIndex:5,text:text(2),sectionTitle:'Первый кадр'}),right:p('dark-split','dark-split','D01-DARK-SPLIT',{photoIndex:6,text:text(2),sectionTitle:'Второй кадр'})},
      {id:'D01-SPREAD-PHOTO-OVERLAY-TEXT',name:'Текст поверх фотографии',note:'Только при свободной зоне в кадре',left:p('photo-overlay-text','photo-overlay-text','D01-PHOTO-OVERLAY-TEXT',{photoIndex:2,text:text(1)}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-PHOTO-GRADIENT-TEXT',name:'Фото и текст на одном листе с градиентным полем',note:'Дополнительная композиция: текст лежит на плавно затухающем поле цвета страницы',left:p('photo-gradient-text','photo-gradient-text','D01-PHOTO-GRADIENT-TEXT',{photoIndex:4,text:text(2),sectionTitle:'Мягкий переход'}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-DARK-GRADIENT-PHOTO',name:'Фото и текст на тёмном градиентном поле',note:'Дополнительная композиция: обе страницы тёмные, непрозрачное поле занимает около 20% фото и плавно открывает остальной кадр',left:p('dark-gradient-photo','dark-gradient-photo','D01-DARK-GRADIENT-PHOTO',{photoIndex:5,text:text(2),sectionTitle:'Тёмный переход'}),right:p('dark-text','dark-text','D01-DARK-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-QUOTE-BAND',name:'Два фото и верхняя полоса с цитатой',note:'Разные размеры фотографий под общей полосой',left:p('quote-band-photo','quote-band-photo','D01-QUOTE-BAND-PHOTO',{photoIndex:1,quote:'Мы старались соединить разные голоса в одну цельную историю.'}),right:p('quote-band-photo','quote-band-photo','D01-QUOTE-BAND-PHOTO',{photoIndex:3,secondary:true})},
      {id:'D01-SPREAD-DATE-ERA',name:'Дата как водяной знак',note:'Цифры занимают ширину листа, текст расположен поверх',left:p('date-era','date-era','D01-DATE-ERA',{dateLabel:'1987—1992',text:text(4),sectionTitle:'Переезд'}),right:p('text','prose-dense','D01-TEXT',{text:text(9)})},
      {id:'D01-SPREAD-DOCUMENT',name:'Архивный документ V10',note:'Скан + разлиновка и расшифровка прописью',left:p('document','document-letter','D01-DOCUMENT',{source:{photos:[photos[6]],inferred:{date:'12 марта 1946',place:'Ташкент'}},photoIndex:0}),right:p('document-comment','document-comment','D01-DOCUMENT-COMMENT',{source:{photos:[photos[6]],inferred:{date:'12 марта 1946',place:'Ташкент'}},text:text(3)})}
    ];
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const context={esc,image:(src,index)=>src?.photos?.[index]?.src||'',caption:(src,index)=>src?.photos?.[index]?.caption||'',inferMeta:src=>src?.inferred||{},meta:{title:'Очерки жизни',subtitle:'История нашей семьи',author:'Александр',year:'2026'}};
    const renderPage=(page,side)=>window.OcherkiBookRenderer.renderPage(page,side,context);
    function render(){
      const probe=document.createElement('div');
      probe.style.cssText='position:fixed;left:-20000px;top:0;visibility:hidden;pointer-events:none';
      document.body.appendChild(probe);
      try{for(const item of cases)for(const side of ['left','right']){
        const page=item[side];if(!page || !(page.rhythm || page.layout==='chapter-intro' || page.kind==='text'))continue;
        if(page.proofSourceText===undefined)page.proofSourceText=page.text;
        const split=window.OcherkiBookRenderer.paginateText(page,page.proofSourceText,probe,renderPage,side);
        page.text=split.head;page.sourceText=split.head;page.measuredFlow=split.measuredFlow;
      }}finally{probe.remove();}
      document.getElementById('proofList').innerHTML=cases.map(item=>`<section class="proof-case" id="${esc(item.id)}"><div class="proof-meta"><strong>${esc(item.name)}</strong><span>${esc(item.id)}<br>${esc(item.note)}</span></div><div class="proof-spread"><div class="proof-page"><div class="proof-canvas">${renderPage(item.left,'left')}</div></div><div class="proof-page"><div class="proof-canvas">${renderPage(item.right,'right')}</div></div></div></section>`).join('');
    }
    document.querySelectorAll('[data-format]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-format]').forEach(item=>item.classList.toggle('active',item===button));
      const portrait=button.dataset.format==='portrait';
      document.documentElement.style.setProperty('--book-page-h',portrait?'1196px':'1000px');
      render();
    }));
    window.OcherkiBookRenderer.readyFonts().then(render).catch(error=>{
      document.getElementById('proofList').textContent=`Проверка мастеров остановлена: ${error.message}`;
    });
  })();
  </script>
</body>
</html>
